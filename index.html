<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10192a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ma radio">
<title>Ma radio · Tableau de bord</title>
<style>
:root{--bg:#0c1727;--card:#1c2b41;--border:#354963;--muted:#b9c8db;--blue:#a3ddff;--text:#f7faff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 75% 0%,#233752 0%,#101b2c 55%,#0c1727 100%)}
button,select{font:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b5e4ff;outline-offset:3px}
button:active{transform:scale(.98)}
.shell{max-width:1170px;margin:0 auto;padding:16px 20px 18px;display:flex;flex-direction:column;gap:13px;min-height:100vh;min-height:100dvh}
.card{background:rgba(28,43,65,.97);border:1px solid rgba(200,221,245,.14);border-radius:25px;box-shadow:0 14px 35px rgba(0,0,0,.09)}
.dashboard{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(310px,.92fr);gap:13px}
.clock-panel{min-height:222px;display:flex;flex-direction:column;justify-content:center;padding:24px 30px}
.clock{font-size:clamp(80px,10.7vw,141px);letter-spacing:-.075em;line-height:1;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:-5px}
.colon{color:#8ba6c2;font-weight:250}
.date{font-size:clamp(19px,2.4vw,27px);margin-top:12px;font-weight:520;text-transform:capitalize}
.weather-panel{padding:17px 21px 18px;min-height:222px;display:flex;flex-direction:column;gap:8px}
.weather-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{color:#b5c6d8;font-size:12px;font-weight:760;letter-spacing:.15em;text-transform:uppercase}
.city{appearance:auto;background:#263b54;border:1px solid var(--border);border-radius:11px;padding:9px 11px;color:var(--text);min-width:124px;font-weight:700;font-size:14px}
.weather-current{display:flex;align-items:center;gap:13px;min-height:68px}
.weather-icon{font-size:45px;line-height:1}
.temperature{font-size:52px;font-weight:700;line-height:.98;letter-spacing:-.05em}
.weather-desc{font-size:14px;color:#c5d3e3;margin-top:3px}
.facts{font-size:12px;color:#c6d4e1}
.forecasts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:auto}
.forecast{background:#263950;border-radius:12px;text-align:center;padding:7px 3px;font-size:12px;line-height:1.25}
.forecast .icon{font-size:20px;margin:4px 0}.forecast .temp{font-size:13px;font-weight:700}.forecast .low{color:#afc0d1}
.alertbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;min-height:56px}
.alertname{font-size:15px;font-weight:750;display:flex;align-items:center;gap:10px}
.alertbuttons{display:flex;gap:9px}
.smallbutton{font-size:14px;font-weight:700;color:#ebf6ff;background:#29465f;border:1px solid #54718d;border-radius:11px;padding:10px 15px}
.section-title{font-size:17px;font-weight:700;margin:0 4px -3px;letter-spacing:-.02em}
.radio-layout{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:13px;align-items:stretch}
.station-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,88px);gap:9px}
.station,.more-tile{width:100%;min-width:0;height:88px;border-radius:16px;background:#21324b;border:2px solid rgba(255,255,255,.065);color:white;display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left}
.station.selected,.more-tile.selected{border-color:#9bd6ff;background:#29465c}
.logo-wrap{width:77px;min-width:77px;height:66px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:5px;overflow:hidden}
.logo-img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.logo-fallback{font-size:13px;color:#173650;font-weight:900;text-align:center;line-height:1.1}
.station-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.station-name{font-weight:720;font-size:14px;line-height:1.1}
.station-region{color:#bdcddd;font-size:11px}
.more-tile{position:relative;display:flex;align-items:center;gap:9px}
.more-icon{font-size:26px;flex:none;color:#bde5ff}
.more-label{display:block;font-size:14px;font-weight:730}
.more-current{display:block;font-size:11px;color:#b5c5d6;margin-top:4px}
.more-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.controls{display:flex;flex-direction:column;gap:8px}
.power{border:0;border-radius:19px;color:#10293e;background:linear-gradient(170deg,#a7e2ff,#70c9fa);min-height:157px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:21px;font-weight:800}
.power.on{background:linear-gradient(170deg,#ffd6ce,#ffb9af);color:#6a2c20}
.power-symbol{font-size:57px;line-height:1.12}
.now{padding:10px 12px;border:1px solid #3b4b5f;background:#233950;border-radius:13px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:43px}
.now-name{font-size:13px;font-weight:800}
.now-status{font-size:11px;color:#bbcbdb;line-height:1.35}
.now a{font-size:11px;color:#bce7ff}
.modal{position:fixed;inset:0;background:rgba(4,11,21,.77);z-index:20;display:none;align-items:center;justify-content:center;padding:15px}
.modal.open{display:flex}
.modal-window{background:#14233a;border:1px solid var(--border);border-radius:19px;width:min(1070px,100%);height:min(88vh,770px);overflow:hidden;display:flex;flex-direction:column}
.modal-bar{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-bar strong{font-size:16px}
.modal-actions{display:flex;gap:8px;align-items:center}
.modal-actions button,.modal-actions a{background:#29465f;border:1px solid #597c98;border-radius:10px;color:white;text-decoration:none;padding:9px 11px;font-size:12px;font-weight:700}
.modal-hint{font-size:12px;color:#bacada;background:#172b41;padding:8px 15px}
.modal iframe{border:0;background:#fff;flex:1;width:100%}
@media(max-width:940px){.radio-layout{grid-template-columns:minmax(0,1fr) 190px}.station-grid{grid-template-rows:repeat(2,82px)}.station,.more-tile{height:82px;padding:7px}.logo-wrap{width:62px;min-width:62px;height:57px}.station-name{font-size:13px}}
@media(max-width:760px){.shell{padding:10px;gap:10px}.dashboard{grid-template-columns:1fr;gap:10px}.clock-panel{min-height:145px;padding:16px 20px;text-align:center;align-items:center}.clock{font-size:clamp(65px,17vw,120px)}.date{font-size:18px;margin-top:7px}.weather-panel{min-height:190px}.alertbar{flex-wrap:wrap}.radio-layout{grid-template-columns:1fr 150px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,72px)}.station,.more-tile{height:72px}.logo-wrap{width:55px;min-width:55px;height:53px}.power{min-height:130px}.power-symbol{font-size:47px}}
@media(max-width:500px){.radio-layout{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:135px 1fr;align-items:stretch}.power{min-height:85px;font-size:16px;flex-direction:row}.power-symbol{font-size:38px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.alertbuttons{width:100%}.smallbutton{flex:1;padding:10px}.station-name{font-size:13px}}

/* V6 — évite que le contenu passe sous la barre d’état iPadOS. */
.shell{
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));
}
/* Dans une application ajoutée à l’écran d’accueil, garder une marge visible
   si iPadOS ne rapporte pas correctement la zone protégée. */
@media (display-mode:standalone) {
  .shell {padding-top:calc(27px + env(safe-area-inset-top, 0px));}
}
@media (min-width:761px) {
  .shell {gap:15px;}
  .dashboard {gap:15px;}
  .clock-panel,.weather-panel {min-height:296px;}
  .clock-panel {padding:30px 33px;}
  .clock {font-size:clamp(91px,11.9vw,158px);}
  .date {font-size:clamp(23px,2.6vw,31px);margin-top:16px;}
  .weather-panel {padding:23px 25px;gap:12px;}
  .weather-current {min-height:92px;gap:17px;}
  .weather-icon {font-size:56px;}
  .temperature {font-size:63px;}
  .weather-desc {font-size:16px;}
  .facts {font-size:14px;}
  .forecast {padding:12px 5px;font-size:14px;}
  .forecast .icon {font-size:26px;margin:6px 0;}
  .forecast .temp {font-size:16px;}
  .alertbar {min-height:82px;padding:16px 21px;}
  .alertname {font-size:17px;}
  .smallbutton {font-size:15px;padding:12px 18px;}
  /* La grille 3×2 a exactement la même hauteur que Power + station active */
  .radio-layout {min-height:314px;padding:16px;gap:14px;align-items:stretch;}
  .station-grid {grid-template-rows:repeat(2,minmax(0,1fr));height:100%;gap:10px;}
  .station,.more-tile {height:100%;min-height:0;padding:12px;}
  .logo-wrap {width:83px;min-width:83px;height:76px;}
  .station-name,.more-label {font-size:16px;}
  .station-region,.more-current {font-size:12px;}
  .controls {height:100%;gap:10px;}
  .power {min-height:0;font-size:23px;}
  .power-symbol {font-size:65px;}
  .now {min-height:57px;padding:12px 13px;}
  .now-name {font-size:15px;}
  .now-status {font-size:12px;}
}
@media (min-width:761px) and (max-width:1040px) {
  .logo-wrap {width:64px;min-width:64px;height:64px;}
  .radio-layout {grid-template-columns:minmax(0,1fr) 190px;}
  .station,.more-tile {padding:8px;gap:8px;}
  .station-name,.more-label {font-size:14px;}
  .weather-panel {padding:20px;}
}
/* Réduire un peu les grands panneaux seulement sur les iPad moins hauts. */
@media (min-width:761px) and (max-height:790px) {
  .clock-panel,.weather-panel {min-height:266px;}
  .radio-layout {min-height:282px;}
  .alertbar {min-height:74px;padding-top:11px;padding-bottom:11px;}
  .clock {font-size:clamp(84px,10.8vw,148px);}
  .weather-current {min-height:73px;}
  .forecast {padding:9px 4px;}
  .logo-wrap {height:64px;width:73px;min-width:73px;}
}
@media (max-width:760px){
  .shell{padding:calc(12px + env(safe-area-inset-top, 0px)) max(10px,env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(10px,env(safe-area-inset-left, 0px));}
}
@media (max-width:760px) and (display-mode:standalone){
  .shell{padding-top:calc(26px + env(safe-area-inset-top, 0px));}
}


/* V7 — horloge et date mieux proportionnées, sans changer la hauteur des panneaux. */
@media (min-width:761px) {
  .clock-panel {padding-left:27px;padding-right:27px;}
  .clock {font-size:clamp(98px,12.9vw,173px);letter-spacing:-.078em;}
  .date {font-size:clamp(24px,2.9vw,34px);font-weight:550;margin-top:13px;}
}
@media (max-width:760px) {
  .clock {font-size:clamp(73px,17.7vw,124px);}
  .date {font-size:clamp(19px,4vw,24px);}
}
.clock-panel .theme-toggle {margin-left:1px;flex:0 0 42px;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:#263b54;color:#ffe3a1;display:grid;place-items:center;padding:0;line-height:1}
.ui-icon,.theme-icon{display:inline-flex;align-items:center;justify-content:center;width:1.1em;height:1.1em}
.ui-icon svg,.theme-icon svg{width:100%;height:100%;display:block}
.alertname .ui-icon{width:20px;height:20px;color:#ffd26a}
.smallbutton .ui-icon{width:15px;height:15px;margin-right:8px;vertical-align:-2px}
.more-icon{flex:none;color:#bde5ff;display:flex;align-items:center;justify-content:center;width:30px;height:30px}
.more-icon svg{width:26px;height:26px;display:block}
.power-symbol{display:flex;align-items:center;justify-content:center;width:70px;height:70px;line-height:1.12}
.power-symbol svg{width:62px;height:62px;display:block}
.modal-close-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;vertical-align:-2px}
.modal-close-icon svg{width:14px;height:14px;display:block}
.weather-title .city {margin-left:auto;min-width:0;max-width:180px}
/* Commande du thème à côté de la date dans le panneau horloge. */
.date-row {width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}
.date-row .date {margin-top:0;min-width:0}
.clock-panel .theme-toggle {margin-left:auto;flex-shrink:0}
@media (max-width:760px) {
  .date-row {margin-top:7px}
  .date-row .date {font-size:clamp(17px,4vw,24px)}
}
/* Les espaces et hauteurs du tableau de bord restent inchangés. */

/* Mode clair : couleurs contrastées sans toucher à la structure et aux radios. */
html[data-theme="light"] {--bg:#deebf5;--card:#fff;--border:#b4c6d7;--muted:#4b647b;--text:#1d3045;color-scheme:light}
html[data-theme="light"] body {background:radial-gradient(circle at 75% 0%,#f8fcff 0%,#e9f2fa 58%,#dbe8f3 100%)}
html[data-theme="light"] .card {background:rgba(255,255,255,.96);border-color:#c4d5e4;box-shadow:0 12px 28px rgba(66,102,134,.12)}
html[data-theme="light"] .colon {color:#7194b3}
html[data-theme="light"] .eyebrow {color:#4f657d}
html[data-theme="light"] .city {background:#eaf2fa;border-color:#c4d4e3;color:#18324b}
html[data-theme="light"] .weather-desc,html[data-theme="light"] .facts {color:#516980}
html[data-theme="light"] .forecast {background:#edf4fa;color:#213c55}
html[data-theme="light"] .forecast .low {color:#607b94}
html[data-theme="light"] .smallbutton {color:#1d4563;background:#e6f1f9;border-color:#b6cee0}
html[data-theme="light"] .station,html[data-theme="light"] .more-tile {background:#ecf3fa;border-color:#d2e0ec;color:#1c344d}
html[data-theme="light"] .station.selected,html[data-theme="light"] .more-tile.selected {background:#d6efff;border-color:#3b91c5}
html[data-theme="light"] .station-region,html[data-theme="light"] .more-current {color:#536d84}
html[data-theme="light"] .more-icon {color:#3b83b7}
html[data-theme="light"] .logo-wrap {border:1px solid #e2e9ef}
html[data-theme="light"] .now {background:#eaf2f9;border-color:#c7d6e4;color:#1b344b}
html[data-theme="light"] .now-status {color:#536c82}
html[data-theme="light"] .now a {color:#126a9b}
html[data-theme="light"] .clock-panel .theme-toggle {background:#eaf2fa;border-color:#b9cede;color:#315879}
html[data-theme="light"] .alertname .ui-icon{color:#c58b11}
html[data-theme="light"] .smallbutton .ui-icon{color:#2f6183}
html[data-theme="light"] .more-icon{color:#3b83b7}
html[data-theme="light"] .modal-window {background:#f6fbff;border-color:#b5cadc;color:#19324a}
html[data-theme="light"] .modal-hint {background:#e6f1fa;color:#395975}
html[data-theme="light"] .modal-actions button,html[data-theme="light"] .modal-actions a {background:#e5f1fa;border-color:#b4cbdf;color:#1e4765}


/* V9 : pictogrammes météo vectoriels et horloge agrandie, adaptée à la largeur. */
.weather-icon,.forecast .icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.weather-icon{width:67px;height:67px;flex:0 0 67px}
.weather-icon svg,.forecast .icon svg{width:100%;height:100%;display:block;overflow:visible}
.forecast .icon{width:34px;height:34px;margin:6px auto}
.clock{max-width:100%;font-size:190px;letter-spacing:-.075em}
@media(min-width:761px){.clock{font-size:190px}}
@media(max-width:760px){.clock{font-size:124px}}
@media(max-width:760px){.weather-icon{width:52px;height:52px;flex-basis:52px}.forecast .icon{width:30px;height:30px}}
/* V10 : chiffres plus généreux, style Apple, sans agrandir leur panneau.
   Le scaleX/scaleY agit sur la forme des chiffres ; fitClock tient compte
   de l’élargissement réel pour éviter tout débordement. */
.clock{
  font-family:"Arial Rounded MT Bold","Arial Black",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-weight:800;
  letter-spacing:-.055em;
  line-height:1;
  transform:scale(1.07,1.09);
  transform-origin:center center;
}
.clock .colon{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:360;}



/* Compatibilité avec Safari/iPadOS 15 (iPad Air 2, 1024×768 en paysage).
   Des hauteurs en pourcentage sur les éléments d'une grille imbriquée
   peuvent se résoudre en boucle et étirer les tuiles indéfiniment.
   Ici toutes les hauteurs de la zone radio sont déterminées en pixels,
   sans modifier l'affichage des grands iPad Pro. */
@media (min-width:761px) and (max-width:1100px) {
  .radio-layout {height:282px;min-height:0;align-items:start;}
  .station-grid {
    height:248px;
    min-height:0;
    grid-template-rows:119px 119px;
    gap:10px;
    align-content:start;
  }
  .station,.more-tile {height:119px;min-height:0;max-height:119px;}
  .controls {height:248px;min-height:0;}
  .power {min-height:0;flex:1 1 auto;}
}


/* V12 : météo heure par heure, minuterie, veille douce.
   Compatibilité Safari 15 : pas de dvh obligatoire, pas de CSS récent critique. */
.forecasts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.forecast{min-width:0;padding:8px 2px;font-size:12px}
.forecast .icon{height:28px;width:28px;margin:3px auto}
.forecast .temp{font-size:15px}
.forecast .chance{font-size:11px;color:#8dd7fc;margin-top:3px;white-space:nowrap}
html[data-theme="light"] .forecast .chance{color:#276a95}
.smallbutton{white-space:nowrap}
.alertbar{gap:6px}
.alertbuttons{flex-wrap:nowrap;gap:7px}
.alertname{white-space:nowrap}
.soft-dim{position:fixed;inset:0;background:rgba(0,0,0,.67);opacity:0;visibility:hidden;pointer-events:none;z-index:10;transition:opacity 1.2s ease}
.soft-dim.is-on{opacity:1;visibility:visible}
.tools-modal{position:fixed;inset:0;background:rgba(4,11,21,.76);z-index:30;display:none;align-items:center;justify-content:center;padding:22px}
.tools-modal.open{display:flex}
.tools-window{width:min(780px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;background:#182b43;color:#f4faff;border:1px solid rgba(200,221,245,.2);border-radius:22px;box-shadow:0 26px 70px rgba(0,0,0,.34)}
.tools-heading{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(200,221,245,.17)}
.tools-heading strong{font-size:20px}
.tools-close{background:#304860;color:inherit;border:1px solid #536c82;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.tools-body{padding:18px 21px 24px;overflow-y:auto;max-height:70vh}
.hourly-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.hourly-item{background:#263950;border-radius:14px;padding:12px 8px;text-align:center}
.hourly-item .icon{width:38px;height:38px;margin:5px auto}
.hourly-item .icon svg{width:100%;height:100%}
.hourly-item .hour{font-weight:750;font-size:15px}
.hourly-item .temp{font-size:21px;font-weight:800;margin:5px 0}
.hourly-item .rain{font-size:13px;color:#a5dafa}
.timer-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timer-option{border:1px solid #5d7791;background:#29465f;color:#fff;border-radius:14px;padding:19px 8px;font-size:20px;font-weight:750}
.timer-option.cancel{grid-column:span 3;background:#423d4f;color:#fff3ef}
.timer-detail{font-size:15px;color:#c4d3e2;margin-bottom:17px;line-height:1.5}
.timer-option:disabled{opacity:.5;cursor:default}
html[data-theme="light"] .tools-window{background:#fff;color:#1c344d;border-color:#c5d6e4}
html[data-theme="light"] .tools-heading{border-color:#d2e0ec}
html[data-theme="light"] .tools-close{background:#edf4fa;color:#213c55;border-color:#c4d4e3}
html[data-theme="light"] .hourly-item{background:#edf4fa}
html[data-theme="light"] .hourly-item .rain{color:#256f9e}
html[data-theme="light"] .timer-detail{color:#526a80}
@media (max-width:1100px) and (min-width:761px){
  .alertbar{padding-left:14px;padding-right:14px}
  .alertname{font-size:15px}
  .smallbutton{padding:10px 11px;font-size:13px}
  .smallbutton .ui-icon{margin-right:5px}
}
@media (max-width:760px){
  .alertbar{flex-wrap:wrap}
  .alertname{font-size:14px}
  .alertbuttons{width:100%;justify-content:space-between}
  .smallbutton{font-size:12px;padding:8px 7px;flex:1}
  .smallbutton .ui-icon{width:13px;height:13px;margin-right:4px}
  .forecasts{gap:5px}
  .forecast .temp{font-size:13px}
  .hourly-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tools-modal{padding:10px}

}
@media (max-width:410px){
  .alertbuttons{gap:5px}
  .smallbutton .ui-icon{display:none}
  .smallbutton{font-size:11px}
  .hourly-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="shell">
  <main class="dashboard">
    <section class="card clock-panel" aria-label="Horloge et date">
      <div class="clock" id="clockDisplay"><span id="hour">--</span><span class="colon">:</span><span id="minute">--</span></div>
      <div class="date-row">
        <div class="date" id="date">Chargement…</div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activer le mode clair" title="Passer en mode clair"><span id="themeSymbol" class="theme-icon" aria-hidden="true"></span></button>
      </div>
    </section>
    <section class="card weather-panel" aria-label="Météo">
      <div class="weather-title"><span class="eyebrow">La météo</span>
        <select class="city" id="city" aria-label="Choisir la ville">
          <option value="mons">Mons</option>
          <option value="bruxelles">Bruxelles</option>
          <option value="conchil">Conchil-le-Temple</option>

      </div>
      <div class="weather-current"><span class="weather-icon" id="weatherIcon" aria-hidden="true"></span><div><div class="temperature" id="currentTemp">--°</div><div class="weather-desc" id="weatherDesc">Chargement…</div></div></div>
      <div class="facts" id="weatherFacts">Mise à jour de la météo…</div>
      <div class="forecasts" id="forecasts" aria-label="Prévisions des prochaines heures"><div class="forecast">Prévisions…</div></div>
    </section>
  </main>
  <section class="card alertbar" aria-label="Météo et outils radio">
    <div class="alertname"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8M8 21h8M12 8v4l3 2"></path><circle cx="12" cy="12" r="9"></circle></svg></span> Météo &amp; radio</div>
    <div class="alertbuttons">
      <button class="smallbutton" id="hourlyButton" type="button" aria-label="Voir les prévisions météo heure par heure"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span>Prévisions</button>
      <button class="smallbutton" id="timerButton" type="button" aria-label="Régler la minuterie d'arrêt radio"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6M18 5l2 2"></path></svg></span><span id="timerButtonLabel">Minuterie</span></button>
      <button class="smallbutton" id="dimButton" type="button" aria-pressed="true" aria-label="Désactiver la veille douce"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A7.9 7.9 0 0 1 9.8 4a8.9 8.9 0 1 0 10.2 10.2z"></path></svg></span><span id="dimButtonLabel">Veille douce : oui</span></button>
    </div>
  </section>
    <section class="card radio-layout" aria-label="Lecteur radio">
    <div class="station-grid" id="favorites">
      <!-- Généré par JavaScript : 5 favorites et un menu de stations -->
    </div>
    <div class="controls">
      <button class="power" id="power" type="button" aria-pressed="false" aria-label="Allumer la radio">
        <span class="power-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M7.05 5.8a8 8 0 1 0 9.9 0"></path></svg></span><span id="powerLabel">Allumer</span>
      </button>
      <div class="now" role="status">
        <div class="now-name" id="selectedName">VivaCité · Hainaut</div>
        <div class="now-status" id="playStatus">Radio éteinte</div>
        <a id="radioLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none">Ouvrir le site de la station</a>
      </div>
    </div>
  </section>
</div>
<div class="soft-dim" id="softDim" aria-hidden="true"></div>
<div class="tools-modal" id="toolsModal" aria-hidden="true">
  <section class="tools-window" role="dialog" aria-modal="true" aria-labelledby="toolsTitle">
    <div class="tools-heading"><strong id="toolsTitle">Prévisions</strong><button type="button" id="toolsClose" class="tools-close" aria-label="Fermer la fenêtre"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div class="tools-body" id="toolsBody"></div>
  </section>
</div>
<audio id="audio" preload="none" playsinline></audio>
<script>
(function(){
  'use strict';
  var fav=[
    {id:'viva',name:'VivaCité',region:'Hainaut',logo:'https://www.rtbfmedia.be/logo-rtbf/vivacite/logo/LOGO_VIVA_RVB_15.png',mark:'Viva',url:'https://radio.rtbf.be/viva-mo/mp3-160/me',home:'https://www.rtbf.be/vivacite'},
    {id:'classic',name:'Classic 21',region:'',logo:'https://www.rtbfmedia.be/logo-rtbf/classic21/logo/COULEUR/LOGO_C21_APLAT_Q_2021.png',mark:'21',url:'https://radio.rtbf.be/c21/mp3-160/me',home:'https://www.rtbf.be/classic21'},
    {id:'nostalgie',name:'Nostalgie',region:'Belgique',logo:'https://cdn.uc.assets.prezly.com/d04eb187-173a-459a-8124-d4d850903ea9/',mark:'N',url:'https://stream.rcs.revma.com/5gd04cwptg0uv',home:'https://www.nostalgie.be/'},
    {id:'sud',name:'Sud Radio',region:'Hainaut',logo:'https://images.ctfassets.net/765y2hpj99ul/01QYn3LvTXFBY3dMURiZoS/3c23027136741a72f32f25b6eb6b2371/SudRadio_O_notes_19.jpg',mark:'Sud',url:'https://stream1.sudradio.be/sudradio-web-hainaut',home:'https://www.sudradio.be/'},
    {id:'contact',name:'Radio Contact',region:'Belgique',logo:'https://www.google.com/s2/favicons?domain=radiocontact.be&sz=256',mark:'Contact',url:'https://radiocontact.ice.infomaniak.ch/radiocontact-mp3-192.mp3',home:'https://www.radiocontact.be/'}
  ];
  // Autres flux MP3 publiés par la RTBF et des diffuseurs : vérifier chaque station sur l'iPad.
  var other=[
    {id:'mradio',name:'M Radio',region:'Mons',url:'https://mradio2.ice.infomaniak.ch/mradio.mp3',home:'https://www.mradio.be/'},
    {id:'premiere',name:'La Première',region:'RTBF',url:'https://radio.rtbf.be/lapremiere/mp3-160/me',home:'https://www.rtbf.be/lapremiere'},
    {id:'tipik',name:'Tipik',region:'RTBF',url:'https://radio.rtbf.be/tipik/mp3-160/me',home:'https://www.rtbf.be/tipik'},
    {id:'viva-bxl',name:'VivaCité Bruxelles',region:'Bruxelles',url:'https://radio.rtbf.be/viva-bxl/mp3-160/me',home:'https://www.rtbf.be/vivacite'},
    {id:'viva-crl',name:'VivaCité Charleroi',region:'Charleroi',url:'https://radio.rtbf.be/viva-crl/mp3-160/me',home:'https://www.rtbf.be/vivacite'},
    {id:'belrtl',name:'Bel RTL',region:'Belgique',url:'https://belrtl.ice.infomaniak.ch/belrtl-mp3-192.mp3',home:'https://www.belrtl.be/'},
    {id:'mint',name:'Mint',region:'Belgique',url:'https://mint.ice.infomaniak.ch/mint-mp3-192.mp3',home:'https://www.mint.be/'}
  ];
  var all=fav.concat(other);
  function el(id){return document.getElementById(id);}
  function set(id,value){el(id).textContent=value;}
  function read(k,def){try{return localStorage.getItem(k)||def;}catch(e){return def;}}
  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
    var icons={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.8v2.1M12 19.1v2.1M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2.8 12h2.1M19.1 12h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"></path></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A7.9 7.9 0 0 1 9.8 4a8.9 8.9 0 1 0 10.2 10.2z"></path></svg>',radio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="3"></rect><path d="M7 7l8-4"></path><circle cx="8.5" cy="12.5" r="1.6"></circle><path d="M13 12h4M13 15h4"></path></svg>'};
  /* Thème mémorisé entre deux ouvertures, sombre par défaut. */
  var activeTheme=read('radio.theme','dark')==='light'?'light':'dark';
  function setTheme(theme){
    activeTheme=theme;
    document.documentElement.setAttribute('data-theme',theme);
    var isLight=theme==='light';
    el('themeSymbol').innerHTML=isLight?icons.moon:icons.sun;
    el('themeToggle').setAttribute('aria-label',isLight?'Activer le mode sombre':'Activer le mode clair');
    el('themeToggle').title=isLight?'Passer en mode sombre':'Passer en mode clair';
    el('themeToggle').setAttribute('aria-pressed',String(isLight));
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',isLight?'#e9f2fa':'#10192a');
  }
  setTheme(activeTheme);
  el('themeToggle').addEventListener('click',function(){
    var next=activeTheme==='dark'?'light':'dark';
    store('radio.theme',next);
    setTheme(next);
  });
  var audio=el('audio'),selected=read('radio.st','viva'),playing=false,serial=0;
  if(!all.some(function(s){return s.id===selected;}))selected='viva';
  var current=function(){return all.filter(function(s){return s.id===selected;})[0];};
  function clock(){var d=new Date();set('hour',String(d.getHours()).padStart(2,'0'));set('minute',String(d.getMinutes()).padStart(2,'0'));set('date',new Intl.DateTimeFormat('fr-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d));}
  clock();setInterval(clock,1000);
  function fitClock(){
    var c=el('clockDisplay'),panel=c.parentElement;
    if(!panel)return;
    var mobile=window.innerWidth<=760;
    var target=mobile?124:194;
    c.style.fontSize=target+'px';
    var style=getComputedStyle(panel);
    var maxWidth=(panel.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-12)/1.07;
    // Le texte réel est mesuré, avec marge pour le léger étirement horizontal.
    if(c.scrollWidth>maxWidth){
      c.style.fontSize=Math.floor(target*maxWidth/c.scrollWidth)+'px';
    }
  }
  fitClock();
  window.addEventListener('resize',fitClock);
  window.addEventListener('orientationchange',fitClock);
  // Adapter également l'horloge une fois les polices système prêtes.
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitClock);


  function logo(s){
    var box=document.createElement('span');box.className='logo-wrap';
    var img=document.createElement('img');img.className='logo-img';img.alt='Logo '+s.name;img.src=s.logo;img.loading='lazy';
    img.onerror=function(){box.textContent='';var sp=document.createElement('span');sp.className='logo-fallback';sp.textContent=s.mark;box.appendChild(sp);};
    box.appendChild(img);return box;
  }
  function render(){
    var grid=el('favorites');grid.textContent='';
    fav.forEach(function(s){
      var b=document.createElement('button');b.className='station'+(selected===s.id?' selected':'');b.type='button';b.setAttribute('aria-pressed',String(selected===s.id));b.setAttribute('aria-label','Choisir '+s.name);
      b.appendChild(logo(s));
      var meta=document.createElement('span');meta.className='station-info';
      var name=document.createElement('span');name.className='station-name';name.textContent=s.name;meta.appendChild(name);
      if(s.region){var r=document.createElement('span');r.className='station-region';r.textContent=s.region;meta.appendChild(r);}
      b.appendChild(meta);b.addEventListener('click',function(){choose(s.id);});grid.appendChild(b);
    });
    var otherActive=!fav.some(function(s){return s.id===selected;});
    var tile=document.createElement('div');tile.className='more-tile'+(otherActive?' selected':'');
    var icon=document.createElement('span');icon.className='more-icon';icon.setAttribute('aria-hidden','true');icon.innerHTML=icons.radio;tile.appendChild(icon);
    var label=document.createElement('span');
    var name=document.createElement('span');name.className='more-label';name.textContent='Autres radios ▾';label.appendChild(name);
    var detail=document.createElement('span');detail.className='more-current';detail.textContent=otherActive?current().name:'Choisir une station';label.appendChild(detail);tile.appendChild(label);
    var select=document.createElement('select');select.className='more-select';select.setAttribute('aria-label','Choisir une autre radio');
    var opt=document.createElement('option');opt.value='';opt.textContent='Autres radios…';select.appendChild(opt);
    other.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name;select.appendChild(o);});
    select.value=otherActive?selected:'';
    select.addEventListener('change',function(){if(this.value)choose(this.value);});tile.appendChild(select);grid.appendChild(tile);
    set('selectedName',current().name+(current().region?' · '+current().region:''));
  }
  function powerUI(){el('power').classList.toggle('on',playing);el('power').setAttribute('aria-pressed',String(playing));el('power').setAttribute('aria-label',playing?'Éteindre la radio':'Allumer la radio');set('powerLabel',playing?'Éteindre':'Allumer');}
  function choose(id){
    if(selected===id){if(!playing)start();return;}
    selected=id;store('radio.st',id);render();
    if(playing)start();else set('playStatus','Radio éteinte');
  }
  function fallback(){el('radioLink').href=current().home;el('radioLink').style.display='inline-block';}
  function start(){
    var s=current(),call=++serial;
    audio.pause();audio.removeAttribute('src');audio.load();el('radioLink').style.display='none';
    audio.src=s.url;playing=true;clearDim();powerUI();set('playStatus','Connexion au direct…');
    try{var p=audio.play();if(p&&p.catch)p.catch(function(){if(call===serial){playing=false;powerUI();set('playStatus','Lecture indisponible.');fallback();scheduleDim(20000);}});}
    catch(e){if(call===serial){playing=false;powerUI();set('playStatus','Lecture impossible.');fallback();scheduleDim(20000);}}
  }
  function stop(){++serial;audio.pause();audio.removeAttribute('src');audio.load();playing=false;if(timerDeadline){timerDeadline=0;updateTimerLabel();}powerUI();set('playStatus','Radio éteinte');el('radioLink').style.display='none';scheduleDim(10000);}
  el('power').addEventListener('click',function(){if(playing)stop();else start();});
  audio.addEventListener('playing',function(){playing=true;powerUI();set('playStatus','● En direct');});
  audio.addEventListener('waiting',function(){if(playing)set('playStatus','Connexion au direct…');});
  audio.addEventListener('error',function(){if(audio.getAttribute('src')){playing=false;powerUI();set('playStatus','Flux indisponible.');fallback();scheduleDim(20000);}});
  render();powerUI();

  // Icônes météo SVG : tracés légers et palette douce, utilisables en clair comme en sombre.
  function weatherSVG(kind){
    var defs={
      sun:'<circle cx="32" cy="31" r="11" fill="#ffd56d" fill-opacity=".22" stroke="#ffce5c" stroke-width="3"/><path d="M32 6v7M32 49v7M7 31h7M50 31h7M14.3 13.3l5 5M44.7 43.7l5 5M14.3 48.7l5-5M44.7 18.3l5-5" stroke="#ffce5c" stroke-width="3" stroke-linecap="round"/>',
      cloud:'<path d="M16 48h30a10 10 0 0 0 1-20 16 16 0 0 0-31-1 11 11 0 0 0 0 21z" fill="#bcd0e2" fill-opacity=".20" stroke="#a8c3d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
      rays:'<circle cx="24" cy="24" r="9" fill="#ffcc67" fill-opacity=".20" stroke="#ffc65d" stroke-width="3"/><path d="M24 7V4M24 44v-5M7 24H4M12 12l-3-3M36 12l3-3M12 36l-3 3" stroke="#ffc65d" stroke-width="2.7" stroke-linecap="round"/>',
      partialCloud:'<path d="M24 48h23a9 9 0 0 0 0-18 13.5 13.5 0 0 0-26-1A9.5 9.5 0 0 0 24 48z" fill="#bcd0e2" fill-opacity=".24" stroke="#b7cee0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
      rain:'<path d="M19 53l-3 5M32 53l-3 5M45 53l-3 5" stroke="#69caff" stroke-width="3.4" stroke-linecap="round"/>',
      drizzle:'<path d="M22 54l-2 3M35 54l-2 3" stroke="#7fd3f4" stroke-width="3" stroke-linecap="round"/>',
      snow:'<path d="M18 54v8M14 58h8M31 54v8M27 58h8M44 54v8M40 58h8" stroke="#91d4fc" stroke-width="2.3" stroke-linecap="round"/>',
      fog:'<path d="M10 50h39M15 57h29M7 43h9M48 43h9" stroke="#8da9bd" stroke-width="3.2" stroke-linecap="round"/>',
      lightning:'<path d="M35 49l-9 12 3-10h-6l9-13" fill="#ffdb7c" stroke="#ffcc59" stroke-width="2" stroke-linejoin="round"/>'
    };
    var art=defs.cloud;
    if(kind==='sun')art=defs.sun;
    else if(kind==='partly'||kind==='variable')art=defs.rays+defs.partialCloud;
    else if(kind==='rain')art=defs.cloud+defs.rain;
    else if(kind==='drizzle')art=defs.cloud+defs.drizzle;
    else if(kind==='snow')art=defs.cloud+defs.snow;
    else if(kind==='fog')art=defs.cloud+defs.fog;
    else if(kind==='storm')art=defs.cloud+defs.lightning;
    return '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+art+'</svg>';
  }
  function icon(code){
    if(code===0)return ['sun','Ciel dégagé'];
    if(code===1||code===2)return ['partly','Partiellement nuageux'];
    if(code===3)return ['cloud','Couvert'];
    if(code===45||code===48)return ['fog','Brouillard'];
    if([51,53,55,56,57].indexOf(code)>-1)return ['drizzle','Bruine'];
    if([61,63,65,66,67,80,81,82].indexOf(code)>-1)return ['rain','Pluie'];
    if([71,73,75,77,85,86].indexOf(code)>-1)return ['snow','Neige'];
    if([95,96,99].indexOf(code)>-1)return ['storm','Orages'];
    return ['variable','Conditions variables'];
  }
  el('weatherIcon').innerHTML=weatherSVG('cloud');
  var places={mons:{name:'Mons',country:'BE'},bruxelles:{name:'Bruxelles',country:'BE'},conchil:{name:'Conchil-le-Temple',country:'FR'}};
  var city=el('city'),lastCity=read('radio.city','mons');city.value=places[lastCity]?lastCity:'mons';
  var hourlyForecast=[];
  function updateWeather(){
    var selectedCity=city.value,p=places[selectedCity];set('weatherDesc','Actualisation…');
    fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.name)+'&count=10&language=fr&format=json')
    .then(function(r){if(!r.ok)throw Error('localisation');return r.json();})
    .then(function(g){var loc=(g.results||[]).filter(function(x){return x.country_code===p.country;})[0];
      if(!loc && selectedCity==='conchil') loc={latitude:50.37093,longitude:1.66575};
      if(!loc)throw Error('ville introuvable');
      var qs='latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,apparent_temperature&hourly=temperature_2m,precipitation_probability,weather_code&timezone=auto&forecast_days=2';
      return fetch('https://api.open-meteo.com/v1/forecast?'+qs);})
    .then(function(r){if(!r.ok)throw Error('météo');return r.json();})
    .then(function(data){if(city.value!==selectedCity)return;
      var c=data.current,v=icon(c.weather_code);
      el('weatherIcon').innerHTML=weatherSVG(v[0]);
      set('weatherDesc',v[1]);set('currentTemp',Math.round(c.temperature_2m)+'°');
      set('weatherFacts','Ressenti '+Math.round(c.apparent_temperature)+'° · Humidité '+Math.round(c.relative_humidity_2m)+' % · Vent '+Math.round(c.wind_speed_10m)+' km/h');
      var h=data.hourly,nowHour=(c.time||'').slice(0,13),startIndex=0;
      while(startIndex<h.time.length && h.time[startIndex].slice(0,13)<nowHour)startIndex++;
      hourlyForecast=[];
      for(var i=startIndex;i<Math.min(startIndex+16,h.time.length);i++){
        hourlyForecast.push({time:h.time[i],temp:h.temperature_2m[i],rain:h.precipitation_probability[i],code:h.weather_code[i]});
      }
      var box=el('forecasts');box.textContent='';
      hourlyForecast.slice(0,4).forEach(function(hour){
        var x=document.createElement('div');x.className='forecast';
        var status=icon(hour.code);
        var hh=hour.time.slice(11,13);
        var pop=hour.rain==null?'—':Math.round(hour.rain)+' %';
        x.innerHTML='<div>'+hh+' h</div><div class="icon">'+weatherSVG(status[0])+'</div><div class="temp">'+Math.round(hour.temp)+'°</div><div class="chance">☂ '+pop+'</div>';
        box.appendChild(x);
      });
      if(!hourlyForecast.length){box.textContent='Prévisions horaires indisponibles';}
      if(el('toolsModal').classList.contains('open')&&activeTool==='hourly')renderHourlyTool();
    }).catch(function(){if(city.value===selectedCity){set('weatherDesc','Météo indisponible');set('weatherFacts','Vérifier la connexion Internet');}});
  }
  city.addEventListener('change',function(){store('radio.city',city.value);updateWeather();});
  updateWeather();setInterval(updateWeather,20*60*1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){clock();updateWeather();}});

  // Modales créées dans la page : indépendantes des sites tiers.
  var toolsModal=el('toolsModal'),activeTool='';
  var timerDeadline=0, timerTick=null;
  var dimEnabled=read('radio.dim','yes')!=='no';
  var dimTimeout=null,dimIsOn=false;
  function clearDim(){
    if(dimTimeout){clearTimeout(dimTimeout);dimTimeout=null;}
    el('softDim').classList.remove('is-on');dimIsOn=false;
  }
  function scheduleDim(delay){
    clearDim();
    if(!dimEnabled||playing||toolsModal.classList.contains('open'))return;
    dimTimeout=setTimeout(function(){
      if(!playing&&dimEnabled&&!toolsModal.classList.contains('open')){
        el('softDim').classList.add('is-on');dimIsOn=true;
      }
    },delay);
  }
  function wake(){
    if(dimIsOn){clearDim();scheduleDim(25000);}
  }
  document.addEventListener('touchstart',wake,{passive:true});
  document.addEventListener('mousedown',wake);
  el('dimButton').addEventListener('click',function(){
    dimEnabled=!dimEnabled;store('radio.dim',dimEnabled?'yes':'no');updateDimButton();
    if(dimEnabled)scheduleDim(10000);else clearDim();
  });
  function updateDimButton(){
    set('dimButtonLabel','Veille douce : '+(dimEnabled?'oui':'non'));
    el('dimButton').setAttribute('aria-pressed',String(dimEnabled));
    el('dimButton').setAttribute('aria-label',dimEnabled?'Désactiver la veille douce':'Activer la veille douce');
  }
  updateDimButton();
  function openTools(tool){
    activeTool=tool;clearDim();toolsModal.classList.add('open');toolsModal.setAttribute('aria-hidden','false');
    if(tool==='hourly'){set('toolsTitle','Prévisions · '+places[city.value].name);renderHourlyTool();}
    else{set('toolsTitle','Minuterie radio');renderTimerTool();}
  }
  function closeTools(){
    toolsModal.classList.remove('open');toolsModal.setAttribute('aria-hidden','true');
    activeTool='';scheduleDim(25000);
  }
  function renderHourlyTool(){
    var box=el('toolsBody');box.textContent='';
    var lead=document.createElement('div');lead.className='timer-detail';
    lead.textContent='16 prochaines heures · température et probabilité de précipitations (prévisions, pas observations).';
    box.appendChild(lead);
    if(!hourlyForecast.length){lead.textContent='Prévisions indisponibles. Vérifie la connexion Internet.';return;}
    var grid=document.createElement('div');grid.className='hourly-list';
    hourlyForecast.forEach(function(hour){
      var item=document.createElement('div');item.className='hourly-item';
      var kind=icon(hour.code)[0],precip=hour.rain==null?'—':Math.round(hour.rain)+' %';
      var day=hour.time.slice(8,10)+'/'+hour.time.slice(5,7);
      item.innerHTML='<div class="hour">'+day+' · '+hour.time.slice(11,13)+' h</div><div class="icon">'+weatherSVG(kind)+'</div><div class="temp">'+Math.round(hour.temp)+'°</div><div class="rain">☂ '+precip+'</div>';
      grid.appendChild(item);
    });
    box.appendChild(grid);
  }
  function timerRemaining(){return timerDeadline?Math.max(0,Math.ceil((timerDeadline-Date.now())/60000)):0;}
  function updateTimerLabel(){
    var mins=timerRemaining();
    set('timerButtonLabel',timerDeadline?(mins+' min restantes'):'Minuterie');
    if(timerDeadline&&Date.now()>=timerDeadline){
      timerDeadline=0;set('timerButtonLabel','Minuterie');
      if(playing)stop();
      if(activeTool==='timer')renderTimerTool();
      return;
    }
    if(activeTool==='timer'){
      var details=el('timerDetail');if(details)details.textContent=timerDeadline?'Arrêt automatique dans '+mins+' minute'+(mins>1?'s':'')+'.':'Choisis dans combien de temps arrêter la radio.';
    }
  }
  function startTimer(minutes){
    if(!minutes){timerDeadline=0;}
    else{timerDeadline=Date.now()+minutes*60000;}
    updateTimerLabel();renderTimerTool();
  }
  function renderTimerTool(){
    var box=el('toolsBody');box.textContent='';
    var info=document.createElement('div');info.className='timer-detail';info.id='timerDetail';
    info.textContent=timerDeadline?'Arrêt automatique dans '+timerRemaining()+' minutes.':'Choisis dans combien de temps arrêter la radio.';
    box.appendChild(info);
    var group=document.createElement('div');group.className='timer-options';
    [15,30,45,60,90].forEach(function(minutes){
      var b=document.createElement('button');b.type='button';b.className='timer-option';b.textContent=minutes+' min';
      b.addEventListener('click',function(){startTimer(minutes);closeTools();});group.appendChild(b);
    });
    var cancel=document.createElement('button');cancel.type='button';cancel.className='timer-option cancel';cancel.textContent='Annuler la minuterie';cancel.disabled=!timerDeadline;
    cancel.addEventListener('click',function(){startTimer(0);closeTools();});group.appendChild(cancel);
    box.appendChild(group);
    var note=document.createElement('div');note.className='timer-detail';note.style.marginTop='16px';
    note.textContent='La minuterie fonctionne tant que la page reste active. iPadOS peut suspendre le décompte lorsque Safari passe en arrière-plan ou que l’écran est verrouillé.';
    box.appendChild(note);
  }
  el('hourlyButton').addEventListener('click',function(){openTools('hourly');});
  el('timerButton').addEventListener('click',function(){openTools('timer');});
  el('toolsClose').addEventListener('click',closeTools);
  toolsModal.addEventListener('click',function(e){if(e.target===toolsModal)closeTools();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&toolsModal.classList.contains('open'))closeTools();});
  timerTick=setInterval(function(){if(timerDeadline)updateTimerLabel();},1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)updateTimerLabel();});
  scheduleDim(40000);

})();
</script>
</body>
</html>
