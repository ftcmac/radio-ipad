<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10192a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ma radio">
<title>Ma radio · Tableau de bord</title>
<style>
:root{--bg:#0c1727;--card:#1c2b41;--border:#354963;--muted:#b9c8db;--blue:#a3ddff;--text:#f7faff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 75% 0%,#233752 0%,#101b2c 55%,#0c1727 100%)}
button,select{font:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b5e4ff;outline-offset:3px}
button:active{transform:scale(.98)}
.shell{max-width:1170px;margin:0 auto;padding:16px 20px 18px;display:flex;flex-direction:column;gap:13px;min-height:100vh;min-height:100dvh}
.card{background:rgba(28,43,65,.97);border:1px solid rgba(200,221,245,.14);border-radius:25px;box-shadow:0 14px 35px rgba(0,0,0,.09)}
.dashboard{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(310px,.92fr);gap:13px}
.clock-panel{min-height:222px;display:flex;flex-direction:column;justify-content:center;padding:24px 30px}
.clock{font-size:clamp(80px,10.7vw,141px);letter-spacing:-.075em;line-height:1;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:-5px}
.colon{color:#8ba6c2;font-weight:250}
.date{font-size:clamp(19px,2.4vw,27px);margin-top:12px;font-weight:520;text-transform:capitalize}
.weather-panel{padding:17px 21px 18px;min-height:222px;display:flex;flex-direction:column;gap:8px}
.weather-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{color:#b5c6d8;font-size:12px;font-weight:760;letter-spacing:.15em;text-transform:uppercase}
.city{appearance:auto;background:#263b54;border:1px solid var(--border);border-radius:11px;padding:9px 11px;color:var(--text);min-width:124px;font-weight:700;font-size:14px}
.weather-current{display:flex;align-items:center;gap:13px;min-height:68px}
.weather-icon{font-size:45px;line-height:1}
.temperature{font-size:52px;font-weight:700;line-height:.98;letter-spacing:-.05em}
.weather-desc{font-size:14px;color:#c5d3e3;margin-top:3px}
.facts{font-size:12px;color:#c6d4e1}
.forecasts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:auto}
.forecast{background:#263950;border-radius:12px;text-align:center;padding:7px 3px;font-size:12px;line-height:1.25}
.forecast .icon{font-size:20px;margin:4px 0}.forecast .temp{font-size:13px;font-weight:700}.forecast .low{color:#afc0d1}
.alertbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;min-height:56px}
.alertname{font-size:15px;font-weight:750;display:flex;align-items:center;gap:10px}
.alertbuttons{display:flex;gap:9px}
.smallbutton{font-size:14px;font-weight:700;color:#ebf6ff;background:#29465f;border:1px solid #54718d;border-radius:11px;padding:10px 15px}
.section-title{font-size:17px;font-weight:700;margin:0 4px -3px;letter-spacing:-.02em}
.radio-layout{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:13px;align-items:stretch}
.station-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,88px);gap:9px}
.station,.more-tile{width:100%;min-width:0;height:88px;border-radius:16px;background:#21324b;border:2px solid rgba(255,255,255,.065);color:white;display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left}
.station.selected,.more-tile.selected{border-color:#9bd6ff;background:#29465c}
.logo-wrap{width:77px;min-width:77px;height:66px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:5px;overflow:hidden}
.logo-img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.logo-fallback{font-size:13px;color:#173650;font-weight:900;text-align:center;line-height:1.1}
.station-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.station-name{font-weight:720;font-size:14px;line-height:1.1}
.station-region{color:#bdcddd;font-size:11px}
.more-tile{position:relative;display:flex;align-items:center;gap:9px}
.more-icon{font-size:26px;flex:none;color:#bde5ff}
.more-label{display:block;font-size:14px;font-weight:730}
.more-current{display:block;font-size:11px;color:#b5c5d6;margin-top:4px}
.more-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.controls{display:flex;flex-direction:column;gap:8px}
.power{border:0;border-radius:19px;color:#10293e;background:linear-gradient(170deg,#a7e2ff,#70c9fa);min-height:157px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:21px;font-weight:800}
.power.on{background:linear-gradient(170deg,#ffd6ce,#ffb9af);color:#6a2c20}
.power-symbol{font-size:57px;line-height:1.12}
.now{padding:10px 12px;border:1px solid #3b4b5f;background:#233950;border-radius:13px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:43px}
.now-name{font-size:13px;font-weight:800}
.now-status{font-size:11px;color:#bbcbdb;line-height:1.35}
.now a{font-size:11px;color:#bce7ff}
.modal{position:fixed;inset:0;background:rgba(4,11,21,.77);z-index:20;display:none;align-items:center;justify-content:center;padding:15px}
.modal.open{display:flex}
.modal-window{background:#14233a;border:1px solid var(--border);border-radius:19px;width:min(1070px,100%);height:min(88vh,770px);overflow:hidden;display:flex;flex-direction:column}
.modal-bar{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-bar strong{font-size:16px}
.modal-actions{display:flex;gap:8px;align-items:center}
.modal-actions button,.modal-actions a{background:#29465f;border:1px solid #597c98;border-radius:10px;color:white;text-decoration:none;padding:9px 11px;font-size:12px;font-weight:700}
.modal-hint{font-size:12px;color:#bacada;background:#172b41;padding:8px 15px}
.modal iframe{border:0;background:#fff;flex:1;width:100%}
@media(max-width:940px){.radio-layout{grid-template-columns:minmax(0,1fr) 190px}.station-grid{grid-template-rows:repeat(2,82px)}.station,.more-tile{height:82px;padding:7px}.logo-wrap{width:62px;min-width:62px;height:57px}.station-name{font-size:13px}}
@media(max-width:760px){.shell{padding:10px;gap:10px}.dashboard{grid-template-columns:1fr;gap:10px}.clock-panel{min-height:145px;padding:16px 20px;text-align:center;align-items:center}.clock{font-size:clamp(65px,17vw,120px)}.date{font-size:18px;margin-top:7px}.weather-panel{min-height:190px}.alertbar{flex-wrap:wrap}.radio-layout{grid-template-columns:1fr 150px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,72px)}.station,.more-tile{height:72px}.logo-wrap{width:55px;min-width:55px;height:53px}.power{min-height:130px}.power-symbol{font-size:47px}}
@media(max-width:500px){.radio-layout{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:135px 1fr;align-items:stretch}.power{min-height:85px;font-size:16px;flex-direction:row}.power-symbol{font-size:38px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.alertbuttons{width:100%}.smallbutton{flex:1;padding:10px}.station-name{font-size:13px}}

/* V6 — évite que le contenu passe sous la barre d’état iPadOS. */
.shell{
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));
}
/* Dans une application ajoutée à l’écran d’accueil, garder une marge visible
   si iPadOS ne rapporte pas correctement la zone protégée. */
@media (display-mode:standalone) {
  .shell {padding-top:calc(27px + env(safe-area-inset-top, 0px));}
}
@media (min-width:761px) {
  .shell {gap:15px;}
  .dashboard {gap:15px;}
  .clock-panel,.weather-panel {min-height:296px;}
  .clock-panel {padding:30px 33px;}
  .clock {font-size:clamp(91px,11.9vw,158px);}
  .date {font-size:clamp(23px,2.6vw,31px);margin-top:16px;}
  .weather-panel {padding:23px 25px;gap:12px;}
  .weather-current {min-height:92px;gap:17px;}
  .weather-icon {font-size:56px;}
  .temperature {font-size:63px;}
  .weather-desc {font-size:16px;}
  .facts {font-size:14px;}
  .forecast {padding:12px 5px;font-size:14px;}
  .forecast .icon {font-size:26px;margin:6px 0;}
  .forecast .temp {font-size:16px;}
  .alertbar {min-height:82px;padding:16px 21px;}
  .alertname {font-size:17px;}
  .smallbutton {font-size:15px;padding:12px 18px;}
  /* La grille 3×2 a exactement la même hauteur que Power + station active */
  .radio-layout {min-height:314px;padding:16px;gap:14px;align-items:stretch;}
  .station-grid {grid-template-rows:repeat(2,minmax(0,1fr));height:100%;gap:10px;}
  .station,.more-tile {height:100%;min-height:0;padding:12px;}
  .logo-wrap {width:83px;min-width:83px;height:76px;}
  .station-name,.more-label {font-size:16px;}
  .station-region,.more-current {font-size:12px;}
  .controls {height:100%;gap:10px;}
  .power {min-height:0;font-size:23px;}
  .power-symbol {font-size:65px;}
  .now {min-height:57px;padding:12px 13px;}
  .now-name {font-size:15px;}
  .now-status {font-size:12px;}
}
@media (min-width:761px) and (max-width:1040px) {
  .logo-wrap {width:64px;min-width:64px;height:64px;}
  .radio-layout {grid-template-columns:minmax(0,1fr) 190px;}
  .station,.more-tile {padding:8px;gap:8px;}
  .station-name,.more-label {font-size:14px;}
  .weather-panel {padding:20px;}
}
/* Réduire un peu les grands panneaux seulement sur les iPad moins hauts. */
@media (min-width:761px) and (max-height:790px) {
  .clock-panel,.weather-panel {min-height:266px;}
  .radio-layout {min-height:282px;}
  .alertbar {min-height:74px;padding-top:11px;padding-bottom:11px;}
  .clock {font-size:clamp(84px,10.8vw,148px);}
  .weather-current {min-height:73px;}
  .forecast {padding:9px 4px;}
  .logo-wrap {height:64px;width:73px;min-width:73px;}
}
@media (max-width:760px){
  .shell{padding:calc(12px + env(safe-area-inset-top, 0px)) max(10px,env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(10px,env(safe-area-inset-left, 0px));}
}
@media (max-width:760px) and (display-mode:standalone){
  .shell{padding-top:calc(26px + env(safe-area-inset-top, 0px));}
}


/* V7 — horloge et date mieux proportionnées, sans changer la hauteur des panneaux. */
@media (min-width:761px) {
  .clock-panel {padding-left:27px;padding-right:27px;}
  .clock {font-size:clamp(98px,12.9vw,173px);letter-spacing:-.078em;}
  .date {font-size:clamp(24px,2.9vw,34px);font-weight:550;margin-top:13px;}
}
@media (max-width:760px) {
  .clock {font-size:clamp(73px,17.7vw,124px);}
  .date {font-size:clamp(19px,4vw,24px);}
}
.clock-panel .theme-toggle {margin-left:1px;flex:0 0 42px;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:#263b54;color:#ffe3a1;display:grid;place-items:center;padding:0;line-height:1}
.ui-icon,.theme-icon{display:inline-flex;align-items:center;justify-content:center;width:1.1em;height:1.1em}
.ui-icon svg,.theme-icon svg{width:100%;height:100%;display:block}
.alertname .ui-icon{width:20px;height:20px;color:#ffd26a}
.smallbutton .ui-icon{width:15px;height:15px;margin-right:8px;vertical-align:-2px}
.more-icon{flex:none;color:#bde5ff;display:flex;align-items:center;justify-content:center;width:30px;height:30px}
.more-icon svg{width:26px;height:26px;display:block}
.power-symbol{display:flex;align-items:center;justify-content:center;width:70px;height:70px;line-height:1.12}
.power-symbol svg{width:62px;height:62px;display:block}
.modal-close-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;vertical-align:-2px}
.modal-close-icon svg{width:14px;height:14px;display:block}
.weather-title .city {margin-left:auto;min-width:0;max-width:180px}
/* Commande du thème à côté de la date dans le panneau horloge. */
.date-row {width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}
.date-row .date {margin-top:0;min-width:0}
.clock-panel .theme-toggle {margin-left:auto;flex-shrink:0}
@media (max-width:760px) {
  .date-row {margin-top:7px}
  .date-row .date {font-size:clamp(17px,4vw,24px)}
}
/* Les espaces et hauteurs du tableau de bord restent inchangés. */

/* Mode clair : couleurs contrastées sans toucher à la structure et aux radios. */
html[data-theme="light"] {--bg:#deebf5;--card:#fff;--border:#b4c6d7;--muted:#4b647b;--text:#1d3045;color-scheme:light}
html[data-theme="light"] body {background:radial-gradient(circle at 75% 0%,#f8fcff 0%,#e9f2fa 58%,#dbe8f3 100%)}
html[data-theme="light"] .card {background:rgba(255,255,255,.96);border-color:#c4d5e4;box-shadow:0 12px 28px rgba(66,102,134,.12)}
html[data-theme="light"] .colon {color:#7194b3}
html[data-theme="light"] .eyebrow {color:#4f657d}
html[data-theme="light"] .city {background:#eaf2fa;border-color:#c4d4e3;color:#18324b}
html[data-theme="light"] .weather-desc,html[data-theme="light"] .facts {color:#516980}
html[data-theme="light"] .forecast {background:#edf4fa;color:#213c55}
html[data-theme="light"] .forecast .low {color:#607b94}
html[data-theme="light"] .smallbutton {color:#1d4563;background:#e6f1f9;border-color:#b6cee0}
html[data-theme="light"] .station,html[data-theme="light"] .more-tile {background:#ecf3fa;border-color:#d2e0ec;color:#1c344d}
html[data-theme="light"] .station.selected,html[data-theme="light"] .more-tile.selected {background:#d6efff;border-color:#3b91c5}
html[data-theme="light"] .station-region,html[data-theme="light"] .more-current {color:#536d84}
html[data-theme="light"] .more-icon {color:#3b83b7}
html[data-theme="light"] .logo-wrap {border:1px solid #e2e9ef}
html[data-theme="light"] .now {background:#eaf2f9;border-color:#c7d6e4;color:#1b344b}
html[data-theme="light"] .now-status {color:#536c82}
html[data-theme="light"] .now a {color:#126a9b}
html[data-theme="light"] .clock-panel .theme-toggle {background:#eaf2fa;border-color:#b9cede;color:#315879}
html[data-theme="light"] .alertname .ui-icon{color:#c58b11}
html[data-theme="light"] .smallbutton .ui-icon{color:#2f6183}
html[data-theme="light"] .more-icon{color:#3b83b7}
html[data-theme="light"] .modal-window {background:#f6fbff;border-color:#b5cadc;color:#19324a}
html[data-theme="light"] .modal-hint {background:#e6f1fa;color:#395975}
html[data-theme="light"] .modal-actions button,html[data-theme="light"] .modal-actions a {background:#e5f1fa;border-color:#b4cbdf;color:#1e4765}


/* V9 : pictogrammes météo vectoriels et horloge agrandie, adaptée à la largeur. */
.weather-icon,.forecast .icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.weather-icon{width:67px;height:67px;flex:0 0 67px}
.weather-icon svg,.forecast .icon svg{width:100%;height:100%;display:block;overflow:visible}
.forecast .icon{width:34px;height:34px;margin:6px auto}
.clock{max-width:100%;font-size:190px;letter-spacing:-.075em}
@media(min-width:761px){.clock{font-size:190px}}
@media(max-width:760px){.clock{font-size:124px}}
@media(max-width:760px){.weather-icon{width:52px;height:52px;flex-basis:52px}.forecast .icon{width:30px;height:30px}}
/* V10 : chiffres plus généreux, style Apple, sans agrandir leur panneau.
   Le scaleX/scaleY agit sur la forme des chiffres ; fitClock tient compte
   de l’élargissement réel pour éviter tout débordement. */
.clock{
  font-family:"Arial Rounded MT Bold","Arial Black",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-weight:800;
  letter-spacing:-.055em;
  line-height:1;
  transform:scale(1.07,1.09);
  transform-origin:center center;
}
.clock .colon{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:360;}



/* Compatibilité avec Safari/iPadOS 15 (iPad Air 2, 1024×768 en paysage).
   Des hauteurs en pourcentage sur les éléments d'une grille imbriquée
   peuvent se résoudre en boucle et étirer les tuiles indéfiniment.
   Ici toutes les hauteurs de la zone radio sont déterminées en pixels,
   sans modifier l'affichage des grands iPad Pro. */
@media (min-width:761px) and (max-width:1100px) {
  .radio-layout {height:282px;min-height:0;align-items:start;}
  .station-grid {
    height:248px;
    min-height:0;
    grid-template-rows:119px 119px;
    gap:10px;
    align-content:start;
  }
  .station,.more-tile {height:119px;min-height:0;max-height:119px;}
  .controls {height:248px;min-height:0;}
  .power {min-height:0;flex:1 1 auto;}
}


/* V12 : météo heure par heure, minuterie, veille douce.
   Compatibilité Safari 15 : pas de dvh obligatoire, pas de CSS récent critique. */
.forecasts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.forecast{min-width:0;padding:8px 2px;font-size:12px}
.forecast .icon{height:28px;width:28px;margin:3px auto}
.forecast .temp{font-size:15px}
.forecast .chance{font-size:11px;color:#8dd7fc;margin-top:3px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px}
.chance-icon,.rain-icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.chance-icon svg,.rain-icon svg{width:13px;height:13px;display:block}
html[data-theme="light"] .forecast .chance{color:#276a95}
.smallbutton{white-space:nowrap}
.alertbar{gap:6px}
.alertbuttons{flex-wrap:nowrap;gap:7px}
.alertname{white-space:nowrap}
.soft-dim{position:fixed;inset:0;background:rgba(0,0,0,.67);opacity:0;visibility:hidden;pointer-events:none;z-index:10;transition:opacity 1.2s ease}
.soft-dim.is-on{opacity:1;visibility:visible}
.tools-modal{position:fixed;inset:0;background:rgba(4,11,21,.76);z-index:30;display:none;align-items:center;justify-content:center;padding:22px}
.tools-modal.open{display:flex}
.tools-window{width:min(780px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;background:#182b43;color:#f4faff;border:1px solid rgba(200,221,245,.2);border-radius:22px;box-shadow:0 26px 70px rgba(0,0,0,.34)}
.tools-heading{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(200,221,245,.17)}
.tools-heading strong{font-size:20px}
.tools-close{background:#304860;color:inherit;border:1px solid #536c82;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.tools-body{padding:18px 21px 24px;overflow-y:auto;max-height:70vh}
.hourly-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.hourly-item{background:#263950;border-radius:14px;padding:12px 8px;text-align:center}
.hourly-item .icon{width:38px;height:38px;margin:5px auto}
.hourly-item .icon svg{width:100%;height:100%}
.hourly-item .hour{font-weight:750;font-size:15px}
.hourly-item .temp{font-size:21px;font-weight:800;margin:5px 0}
.hourly-item .rain{font-size:13px;color:#a5dafa;display:flex;align-items:center;justify-content:center;gap:5px}
.timer-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timer-option{border:1px solid #5d7791;background:#29465f;color:#fff;border-radius:14px;padding:19px 8px;font-size:20px;font-weight:750}
.timer-option.cancel{grid-column:span 3;background:#423d4f;color:#fff3ef}
.timer-detail{font-size:15px;color:#c4d3e2;margin-bottom:17px;line-height:1.5}
.timer-option:disabled{opacity:.5;cursor:default}
html[data-theme="light"] .tools-window{background:#fff;color:#1c344d;border-color:#c5d6e4}
html[data-theme="light"] .tools-heading{border-color:#d2e0ec}
html[data-theme="light"] .tools-close{background:#edf4fa;color:#213c55;border-color:#c4d4e3}
html[data-theme="light"] .hourly-item{background:#edf4fa}
html[data-theme="light"] .hourly-item .rain{color:#256f9e}

.theme-menu.open{display:block}
.theme-choice{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:#f6fbff;background:transparent;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:650;min-height:43px}
.theme-choice.active{background:#365b78}
.theme-menu-icon{width:20px;height:20px;display:flex;flex:0 0 20px;align-items:center;justify-content:center}
.theme-menu-icon svg{width:20px;height:20px}
.theme-check{margin-left:auto;color:#a8e4ff;font-weight:800}
html[data-theme="light"] .clock-mini-button{background:#eaf2fa;color:#315879;border-color:#b9cede}
html[data-theme="light"] .theme-menu{background:#fff;border-color:#b9cede;box-shadow:0 12px 30px rgba(41,76,105,.25)}
html[data-theme="light"] .theme-choice{color:#1e3c55}

html[data-theme="light"] .theme-check{color:#2778ab}

.weather-details{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px 8px;font-size:11.5px;line-height:1.22;color:#c2d9ed;margin-top:0}
.weather-detail{display:inline-flex;align-items:center;gap:5px;white-space:normal;min-width:0}
.weather-detail .detail-symbol{width:15px;height:15px;flex:0 0 15px;display:inline-flex}
.weather-detail svg{width:15px;height:15px}
html[data-theme="light"] .weather-details{color:#416584}
.forecasts{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none;gap:6px;align-items:stretch;padding-bottom:1px;width:100%;min-width:0}
.forecasts::-webkit-scrollbar{display:none}
.forecasts .forecast{flex:0 0 calc((100% - 18px) / 4);min-width:0;scroll-snap-align:start}
@media (min-width:761px){
  .clock-panel .date-row .date{font-size:clamp(20px,2.35vw,30px)}
  .weather-panel{gap:6px;padding-top:16px;padding-bottom:14px}
  .weather-current{min-height:69px;gap:10px}
  .weather-icon{width:54px;height:54px;flex-basis:54px}
  .weather-panel .forecast{padding:5px 2px}
  .weather-panel .forecast .icon{width:27px;height:27px;margin:3px auto}
}
@media (orientation:landscape) and (min-width:761px) and (max-width:1100px) and (max-height:820px){
  .weather-panel{gap:4px;padding-top:12px;padding-bottom:10px}
  .weather-current{min-height:54px}
  .weather-details{font-size:10.5px;gap:2px 8px}
  .weather-detail .detail-symbol,.weather-detail svg{width:13px;height:13px;flex-basis:13px}
  .forecast .chance{margin-top:1px}
  .weather-panel .forecast .icon{width:24px;height:24px;margin:1px auto}
  .weather-panel .forecast{padding:3px 1px}
}
@media (orientation:portrait) and (min-width:600px) and (max-width:1100px){
  .weather-panel{gap:5px;padding:12px 18px}
  .weather-current{min-height:55px}
  .weather-details{font-size:12px}
}
@media (max-width:760px){
  .clock-panel .date-row .date{font-size:clamp(16px,4vw,24px)}
  .clock-mini-button,.clock-panel .theme-toggle{width:36px;height:36px;min-width:36px;min-height:36px;flex-basis:36px}
  .weather-details{font-size:11px}
}
@media (max-width:500px){.forecasts .forecast{flex-basis:calc((100% - 12px) / 3)}}

<body>
<div class="shell">
  <main class="dashboard">
    <section class="card clock-panel" id="clockPanel" aria-label="Horloge et date">

        <div class="date" id="date">Chargement…</div>

          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Choisir le thème" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu" title="Choisir l'apparence"><span id="themeSymbol" class="theme-icon" aria-hidden="true"></span><span class="theme-auto-indicator" id="themeAutoIndicator" aria-hidden="true">A</span></button>
          <div class="theme-menu" id="themeMenu" role="group" aria-label="Apparence du tableau de bord">
            <button type="button" class="theme-choice" data-theme-choice="light"><span class="theme-menu-icon" id="themeMenuSun" aria-hidden="true"></span> Clair <span class="theme-check" aria-hidden="true"></span></button>
            <button type="button" class="theme-choice" data-theme-choice="dark"><span class="theme-menu-icon" id="themeMenuMoon" aria-hidden="true"></span> Sombre <span class="theme-check" aria-hidden="true"></span></button>
            <button type="button" class="theme-choice" data-theme-choice="auto"><span class="theme-menu-icon" id="themeMenuAuto" aria-hidden="true"></span> Automatique <span class="theme-check" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
    </section>
    <section class="card weather-panel" id="weatherPanel" aria-label="Météo">
      <div class="weather-title"><span class="eyebrow">La météo</span>
        <div class="weather-title-actions" id="weatherActions">
          <button class="city city-trigger" id="city" type="button" aria-label="Choisir la localité météo" aria-expanded="false" aria-controls="cityChoices" aria-haspopup="true"><span id="cityLabel">Météo locale</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          <div class="city-choices" id="cityChoices" role="group" aria-label="Localités météo favorites"></div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.2.9-4.5 4.4 1 6.1-5.4-2.8-5.5 2.8 1.1-6.1L3 9.5l6.2-.9L12 3z"/></svg>
          </button>
        </div>
      </div>
      <div class="weather-current"><span class="weather-icon" id="weatherIcon" aria-hidden="true"></span><div><div class="temperature" id="currentTemp">--°</div><div class="weather-desc"><span id="weatherDesc">Chargement…</span><span class="weather-place" id="weatherPlace">· Position actuelle</span></div></div></div>
      <div class="facts" id="weatherFacts">Mise à jour de la météo…</div>
      <div class="weather-details" aria-label="Pluie et soleil">
        <span class="weather-detail rain-detail"><span class="detail-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 16 0H4zM12 11v6a2 2 0 0 0 4 0"></path><path d="M7 15l-1 2M11 15l-1 2M16 15l-1 2" stroke="#73ccf8"></path></svg></span><span id="rainInline">Pluie : actualisation…</span></span>
        <span class="weather-detail sun-detail"><span class="detail-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"></circle><path d="M3 19h18M4 15l2 2M20 15l-2 2M12 1v2M4 8h2M18 8h2"></path></svg></span><span id="sunInline">Lever et coucher : —</span></span>
      </div>
      <div class="forecasts" id="forecasts" aria-label="Prévisions des 12 prochaines heures : faire glisser horizontalement"><div class="forecast">Prévisions…</div></div>
    </section>
  </main>
  <section class="card alertbar" aria-label="Sommeil radio et services">
    <div class="alertname"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="3"></rect><path d="M7 7l8-4M13 12h4M13 15h4"></path><circle cx="8.5" cy="12.5" r="1.6"></circle></svg></span> Radio &amp; outils <span class="connection-state" id="connectionState" role="status" title="Vérification de la connexion" aria-label="Connexion en cours de vérification"></span></div>
    <div class="alertbuttons">
      <button class="smallbutton" id="timerButton" type="button" aria-label="Programmer l'arrêt automatique de la radio (Sommeil)"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A7.9 7.9 0 0 1 9.8 4a8.9 8.9 0 1 0 10.2 10.2z"></path><path d="M17 5v4M15 7h4"></path></svg></span><span id="timerButtonLabel">Sommeil</span></button>
      <button class="smallbutton" id="dimButton" type="button" aria-pressed="true" aria-label="Désactiver la veille douce"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A7.9 7.9 0 0 1 9.8 4a8.9 8.9 0 1 0 10.2 10.2z"></path></svg></span><span id="dimButtonLabel">Veille douce : oui</span></button>
      <button class="smallbutton" id="extrasButton" type="button" aria-label="Consulter la qualité de l'air et les pollens"><span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C11 4 5 8 5 15a5 5 0 0 0 5 5c7 0 10-7 10-16Z"></path><path d="M5 20c2-5 6-9 11-12"></path></svg></span><span id="extrasLabel">Air &amp; pollens</span></button>
    </div>
  </section>
    <section class="card radio-layout" aria-label="Lecteur radio">
    <div class="station-grid" id="favorites">
      <!-- Généré par JavaScript : 5 favorites et un menu de stations -->
    </div>
    <div class="controls">
      <button class="power" id="power" type="button" aria-pressed="false" aria-label="Allumer la radio">
        <span class="power-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M7.05 5.8a8 8 0 1 0 9.9 0"></path></svg></span><span id="powerLabel">Allumer</span>
      </button>
      <div class="now" role="status">
        <div class="now-name" id="selectedName">VivaCité · Hainaut</div>
        <div class="now-status" id="playStatus">Radio éteinte</div>
        <a id="radioLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none">Ouvrir le site de la station</a>
      </div>
    </div>
  </section>
  <footer class="concept-credit" aria-label="Origine du projet">Une idée de Vince <span aria-hidden="true">·</span> novembre 2026</footer>
</div>
<div class="big-clock-overlay" id="bigClockOverlay" role="dialog" aria-modal="true" aria-label="Horloge en plein écran" aria-hidden="true"><button class="big-clock-exit" id="bigClockClose" type="button">Fermer</button><div class="big-clock-display" id="bigClockDisplay">--:--</div><div class="big-clock-date" id="bigClockDate"></div></div>
<div class="timer-toast" id="timerToast" role="alert" aria-live="assertive"></div>
<div class="soft-dim" id="softDim" aria-hidden="true"></div>
<div class="tools-modal" id="toolsModal" aria-hidden="true">
  <section class="tools-window" role="dialog" aria-modal="true" aria-labelledby="toolsTitle">
    <div class="tools-heading"><strong id="toolsTitle">Prévisions</strong><button type="button" id="toolsClose" class="tools-close" aria-label="Fermer la fenêtre" title="Fermer"></button></div>
    <div class="tools-body" id="toolsBody"></div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var fav=[
    {id:'viva',name:'VivaCité',region:'Hainaut',logo:'https://www.rtbfmedia.be/logo-rtbf/vivacite/logo/LOGO_VIVA_RVB_15.png',mark:'Viva',url:'https://radio.rtbf.be/viva-mo/mp3-160/me',home:'https://www.rtbf.be/vivacite'},

    {id:'sud',name:'Sud Radio',region:'Hainaut',logo:'https://images.ctfassets.net/765y2hpj99ul/01QYn3LvTXFBY3dMURiZoS/3c23027136741a72f32f25b6eb6b2371/SudRadio_O_notes_19.jpg',mark:'Sud',url:'https://stream1.sudradio.be/sudradio-web-hainaut',home:'https://www.sudradio.be/'},
    {id:'contact',name:'Radio Contact',region:'Belgique',logo:'https://www.google.com/s2/favicons?domain=radiocontact.be&sz=256',mark:'Contact',url:'https://radiocontact.ice.infomaniak.ch/radiocontact-mp3-192.mp3',home:'https://www.radiocontact.be/'}
  ];
  // Autres flux MP3 publiés par la RTBF et des diffuseurs : vérifier chaque station sur l'iPad.
  var other=[
    {id:'mradio',name:'M Radio',region:'Mons',url:'https://mradio2.ice.infomaniak.ch/mradio.mp3',home:'https://www.mradio.be/'},
    {id:'premiere',name:'La Première',region:'RTBF',url:'https://radio.rtbf.be/lapremiere/mp3-160/me',home:'https://www.rtbf.be/lapremiere'},
    {id:'tipik',name:'Tipik',region:'RTBF',url:'https://radio.rtbf.be/tipik/mp3-160/me',home:'https://www.rtbf.be/tipik'},
    {id:'viva-bxl',name:'VivaCité Bruxelles',region:'Bruxelles',url:'https://radio.rtbf.be/viva-bxl/mp3-160/me',home:'https://www.rtbf.be/vivacite'},
    {id:'viva-crl',name:'VivaCité Charleroi',region:'Charleroi',url:'https://radio.rtbf.be/viva-crl/mp3-160/me',home:'https://www.rtbf.be/vivacite'},
    {id:'belrtl',name:'Bel RTL',region:'Belgique',url:'https://belrtl.ice.infomaniak.ch/belrtl-mp3-192.mp3',home:'https://www.belrtl.be/'},
    {id:'mint',name:'Mint',region:'Belgique',url:'https://mint.ice.infomaniak.ch/mint-mp3-192.mp3',home:'https://www.mint.be/'}
  ];
  var all=fav.concat(other);
  function el(id){return document.getElementById(id);}
  function set(id,value){el(id).textContent=value;}
  function read(k,def){try{return localStorage.getItem(k)||def;}catch(e){return def;}}
  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  // Les configurations restent dans Safari sur l'appareil : aucune donnée de compte.
  function readJSON(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function httpsUrl(v){return typeof v==='string' && /^https:\/\/[^\s]+$/i.test(v.trim());}
  function officialSiteIcon(home){
    if(!httpsUrl(home))return '';
    try{
      var hostname=new URL(home).hostname.toLowerCase();
      if(!hostname||hostname.indexOf('radio-browser.info')>=0)return '';
      return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(hostname)+'&sz=256';
    }catch(e){return '';}
  }
  function imageLink(url){
    if(httpsUrl(url))return url.trim();
    // Les annuaires diffusent parfois un favicon en HTTP ; tenter la version HTTPS.
    if(typeof url==='string' && /^http:\/\/[^\s]+$/i.test(url.trim()))return url.trim().replace(/^http:/i,'https:');
    return '';
  }
  function safeStation(s){
    if(!s||typeof s!=='object'||!httpsUrl(s.url)||typeof s.name!=='string'||!s.name.trim())return null;
    var name=s.name.trim().slice(0,85),id=(typeof s.id==='string'?s.id:'').slice(0,120);
    var home=imageLink(s.home)||'https://www.radio-browser.info/';
    return {id:id||'saved-'+name,name:name,region:String(s.region||'').slice(0,55),subregion:String(s.subregion||'').slice(0,75),logo:imageLink(s.logo),logoBackup:imageLink(s.logoBackup)||officialSiteIcon(home),mark:String(s.mark||name.slice(0,3)).slice(0,14),url:s.url.trim(),home:home};
  }
  var savedRadio=readJSON('radio.library.v1');
  if(savedRadio&&Array.isArray(savedRadio.fav)&&Array.isArray(savedRadio.other)){
    var seen={};
    function checked(list,cap){return list.map(safeStation).filter(function(s){
      if(!s||seen[s.url]||!/^https:\/\//.test(s.url))return false;
      seen[s.url]=true;return true;
    }).slice(0,cap);}
    fav=checked(savedRadio.fav,5);other=checked(savedRadio.other,80);
    all=fav.concat(other); // indispensable : utiliser les favoris mémorisés dès le chargement
  }
  function saveRadios(){store('radio.library.v1',JSON.stringify({fav:fav,other:other}));all=fav.concat(other);}
  function storedRadioById(id){return all.filter(function(s){return s.id===id;})[0]||null;}

    var icons={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.8v2.1M12 19.1v2.1M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2.8 12h2.1M19.1 12h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"></path></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A7.9 7.9 0 0 1 9.8 4a8.9 8.9 0 1 0 10.2 10.2z"></path></svg>',radio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="3"></rect><path d="M7 7l8-4"></path><circle cx="8.5" cy="12.5" r="1.6"></circle><path d="M13 12h4M13 15h4"></path></svg>'};
  function precipIcon(kind){
    if(kind==='umbrella') return '<span class="chance-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 11a8 8 0 0 1 16 0H4z" fill="#9fe1ff" fill-opacity=".14" stroke="#8fdcff" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 11v6.2a1.8 1.8 0 1 0 3.6 0" stroke="#8fdcff" stroke-width="1.8" stroke-linecap="round"/><path d="M7 15.4l-1 1.9M11 15.4l-1 1.9M15 15.4l-1 1.9" stroke="#69caff" stroke-width="1.8" stroke-linecap="round"/></svg></span>';
    return '<span class="chance-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4c1.9 3 4.7 5.5 4.7 8.4A4.7 4.7 0 0 1 12 17a4.7 4.7 0 0 1-4.7-4.6C7.3 9.5 10.1 7 12 4z" fill="#9fe1ff" fill-opacity=".18" stroke="#7fd8ff" stroke-width="1.8"/><path d="M9.5 12.5a2.7 2.7 0 0 0 4 2.1" stroke="#7fd8ff" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
  }
  /* Thème mémorisé entre deux ouvertures, sombre par défaut. */
  var activeTheme=read('radio.theme','dark')==='light'?'light':'dark';
  var autoTheme=read('radio.theme.mode','manual')==='auto';
  var solarData=null,airData=null,airState='wait',activeWeatherCoords=null,airRequestKey='',airLastTime=0;
  var connectivity='checking';
  function setTheme(theme){
    activeTheme=theme;
    document.documentElement.setAttribute('data-theme',theme);
    var isLight=theme==='light';
    el('themeSymbol').innerHTML=isLight?icons.moon:icons.sun;
    el('themeToggle').setAttribute('aria-label','Choisir le thème : '+(autoTheme?'automatique':isLight?'clair':'sombre'));
    el('themeToggle').title='Apparence : '+(autoTheme?'automatique':isLight?'clair':'sombre');
    el('themeToggle').classList.toggle('is-auto',autoTheme);
    updateThemeChoices();
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',isLight?'#e9f2fa':'#10192a');
  }
  function updateThemeChoices(){
    var chosen=autoTheme?'auto':activeTheme;
    var choices=document.querySelectorAll('[data-theme-choice]');
    for(var j=0;j<choices.length;j++){
      var active=choices[j].getAttribute('data-theme-choice')===chosen;
      choices[j].classList.toggle('active',active);
      choices[j].setAttribute('aria-pressed',String(active));
      var mark=choices[j].querySelector('.theme-check');if(mark)mark.textContent=active?'✓':'';
    }
  }
  function closeThemeMenu(){
    el('themeMenu').classList.remove('open');el('themeToggle').setAttribute('aria-expanded','false');
    el('clockPanel').classList.remove('theme-menu-open');
  }
  setTheme(activeTheme);
  el('themeMenuSun').innerHTML=icons.sun;
  el('themeMenuMoon').innerHTML=icons.moon;
  el('themeMenuAuto').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>';

    var opening=!el('themeMenu').classList.contains('open');
    if(opening){el('themeMenu').classList.add('open');el('themeToggle').setAttribute('aria-expanded','true');el('clockPanel').classList.add('theme-menu-open');updateThemeChoices();}
    else closeThemeMenu();
  });
  var themeChoices=document.querySelectorAll('[data-theme-choice]');
  for(var tc=0;tc<themeChoices.length;tc++)themeChoices[tc].addEventListener('click',function(){

        function cleanList(list,limit){return list.map(safeStation).filter(function(s){if(!s||usedURLs[s.url])return false;usedURLs[s.url]=true;return true;}).slice(0,limit);}
        var newFav=cleanList(data.radios.favorites,5),newOther=cleanList(data.radios.others,80);
        var newPlaces=data.weather.places.filter(function(p){return p && typeof p.id==='string' && typeof p.name==='string' && p.name.length>0 && p.name.length<120 && (p.lat==null || (Number.isFinite(Number(p.lat))&&Math.abs(Number(p.lat))<=90)) && (p.lon==null || (Number.isFinite(Number(p.lon))&&Math.abs(Number(p.lon))<=180));}).slice(0,35);
        if(!newPlaces.length)newPlaces=[{id:'mons',name:'Mons',country:'BE',countryName:'Belgique'}];
        if(playing)stop();
        fav=newFav;other=newOther;saveRadios();selected=storedRadioById(data.radios.selected)?data.radios.selected:(all[0]?all[0].id:'');store('radio.st',selected);previewStation=null;
        weatherPlaces=newPlaces;weatherSave();var incomingDefault=data.weather.defaultCity;
        weatherDefault=placeById(incomingDefault)?incomingDefault:weatherPlaces[0].id;store('weather.default.v1',weatherDefault);
        activeCity=weatherDefault;store('radio.city',activeCity);displayWeatherCities();updateWeather();
        if(data.settings&&data.settings.theme){store('radio.theme',data.settings.theme==='light'?'light':'dark');setTheme(data.settings.theme==='light'?'light':'dark');}
        if(data.settings&&typeof data.settings.dimEnabled==='boolean'){dimEnabled=data.settings.dimEnabled;store('radio.dim',dimEnabled?'yes':'no');updateDimButton();}
        if(data.settings&&typeof data.settings.autoTheme==='boolean'){autoTheme=data.settings.autoTheme;store('radio.theme.mode',autoTheme?'auto':'manual');applyAutoTheme();}
        render();powerUI();set('playStatus','Radio éteinte');
        if(activeTool==='cities')renderCitiesTool();else if(activeTool==='radios')renderRadiosTool();
      };reader.onerror=function(){feedback('Impossible de lire le fichier.');};reader.readAsText(file);chooser.value='';
    });
    box.appendChild(make('p','manager-tip','La position GPS exacte n’est volontairement pas incluse dans la sauvegarde. Safari et une application ajoutée à l’écran d’accueil peuvent utiliser des stockages distincts.'));
  }
  function renderCitiesTool(){
    var box=el('toolsBody');box.textContent='';
    box.appendChild(make('p','manager-lead','Choisis « Météo locale » ou une ville favorite. Le choix affiché sera aussi mémorisé pour le prochain lancement.'));
    var position=actionButton('Météo locale · position de cet iPad',function(){requestLocalWeather(function(message){state(message);});},'primary');
    box.appendChild(position);
    var state=feedbackLine(box);
    sectionTitle(box,'Mes villes favorites');
    var list=make('div','manager-list');box.appendChild(list);
    weatherPlaces.forEach(function(p){
      var item=managerRow(p.name, (p.countryName||'Localisation GPS')+(p.id===weatherDefault?' · ★ Par défaut':''));
      item.actions.appendChild(actionButton('Afficher',function(){chooseCity(p.id);renderCitiesTool();},p.id===activeCity?'primary':''));
      if(p.id!==weatherDefault)item.actions.appendChild(actionButton('★ Par défaut',function(){saveWeatherDefault(p.id);chooseCity(p.id);renderCitiesTool();}));
      var remove=actionButton('Retirer',function(){
        weatherPlaces=weatherPlaces.filter(function(x){return x.id!==p.id;});
        if(!weatherPlaces.length)weatherPlaces=[defaultPlaces[0]];
        if(weatherDefault===p.id)saveWeatherDefault(weatherPlaces[0].id);
        if(activeCity===p.id)activeCity=weatherDefault;
        weatherSave();displayWeatherCities();updateWeather();renderCitiesTool();
      },'warn');
      remove.disabled=weatherPlaces.length<=1;item.actions.appendChild(remove);
      list.appendChild(item.row);
    });
    sectionTitle(box,'Rechercher une localité');
    var form=make('form','manager-search');
    var input=make('input','manager-input');input.type='search';input.placeholder='Ex. : Lille, Namur, Paris…';input.autocomplete='off';input.setAttribute('aria-label','Nom de la localité');
    var submit=make('button','manager-btn primary','Rechercher');submit.type='submit';
    var geo=make('div','manager-geo-row');var country=countryPicker('Filtrer les villes par pays');country.value='BE';
    var region=make('input','manager-input');region.type='search';region.placeholder='Région / province (facultatif)';region.setAttribute('aria-label','Région ou province de la ville');
    geo.appendChild(country);geo.appendChild(region);
    form.appendChild(input);form.appendChild(submit);box.appendChild(form);box.appendChild(geo);
    var results=make('div','manager-list');box.appendChild(results);
    var searchState=feedbackLine(box);
    form.addEventListener('submit',function(e){
      e.preventDefault();var q=input.value.trim();if(q.length<2){searchState('Saisis au moins deux caractères du nom de la ville.');return;}
      searchState('Recherche des localités…');results.textContent='';submit.disabled=true;
      var url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=100&language=fr&format=json';
      if(country.value)url+='&countryCode='+encodeURIComponent(country.value);
      fetch(url)
      .then(function(r){if(!r.ok)throw Error('Service indisponible');return r.json();})
      .then(function(data){
        submit.disabled=false;
        var matches=(data.results||[]).filter(function(loc){
          return (!country.value||loc.country_code===country.value)&&(!region.value.trim()||normalizeRegion([loc.admin1,loc.admin2,loc.admin3].join(' ')).indexOf(normalizeRegion(region.value))>=0);
        }).slice(0,22);
        searchState(matches.length?matches.length+' résultat(s) : sélectionne la bonne commune.':'Aucune commune trouvée avec ces filtres. Essaie une autre région ou retire le filtre.');
        matches.forEach(function(loc){
          var label=loc.name+', '+(loc.admin1?loc.admin1+' · ':'')+loc.country;
          var item=managerRow(label,'Coordonnées météo : '+Number(loc.latitude).toFixed(2)+'°, '+Number(loc.longitude).toFixed(2)+'°');
          var locId='geo-'+loc.id;
          var exists=weatherPlaces.some(function(x){return x.id===locId;});
          var add=actionButton(exists?'Déjà enregistrée':'+ Favori',function(){
            if(weatherPlaces.some(function(x){return x.id===locId;})){searchState('Cette ville est déjà dans tes favoris.');return;}
            if(weatherPlaces.length>=35){searchState('Limite de 35 villes favorites atteinte.');return;}
            weatherPlaces.push({id:locId,name:loc.name,country:loc.country_code,countryName:loc.country,region:loc.admin1||'',lat:loc.latitude,lon:loc.longitude});
            weatherSave();displayWeatherCities();chooseCity(locId);renderCitiesTool();
          },exists?'':'primary');add.disabled=exists;item.actions.appendChild(add);results.appendChild(item.row);
        });
      }).catch(function(){submit.disabled=false;searchState('Recherche indisponible. Vérifie ta connexion Wi-Fi.');});
    });
    addBackupSection(box);
  }

  function addStation(s){
    var clean=safeStation(s);if(!clean)return false;
    if(all.some(function(x){return x.url===clean.url||x.id===clean.id;}))return false;
    if(all.length>=85)return false;
    other.push(clean);saveRadios();
    // Une radio écoutée en essai devient la station sélectionnée si on l'enregistre.
    // Le son continue sans interruption et les favoris reflètent le bon état.
    if(previewStation&&previewStation.url===clean.url){
      previewStation=null;
      selected=clean.id;store('radio.st',selected);
      if(playing)set('playStatus','● En direct');
    }
    render();return true;
  }
  function promoteStation(id){
    var station=storedRadioById(id);if(!station)return;
    var index=fav.findIndex(function(s){return s.id===id;});
    if(index>=0){
      fav.splice(index,1);other.push(station);
    }else{
      other=other.filter(function(s){return s.id!==id;});
      if(fav.length>=5){var old=fav.pop();other.unshift(old);}
      fav.push(station);
    }
    saveRadios();render();renderRadiosTool();
  }
  function moveFavorite(id,direction){
    var index=fav.findIndex(function(s){return s.id===id;});var target=index+direction;
    if(index<0||target<0||target>=fav.length)return;
    var moved=fav.splice(index,1)[0];fav.splice(target,0,moved);
    saveRadios();render();renderRadiosTool();
  }
  function removeStation(id){
    if(previewStation&&previewStation.id===id){previewStation=null;}
    var isSelected=selected===id;
    var wasPlaying=playing&&isSelected;
    fav=fav.filter(function(s){return s.id!==id;});other=other.filter(function(s){return s.id!==id;});
    saveRadios();
    if(isSelected){selected=all.length?all[0].id:'';store('radio.st',selected);}
    if(wasPlaying)stop();render();renderRadiosTool();
  }
  function radioSearchResult(entry){
    var url=(entry.url_resolved||entry.url||'').trim();
    if(!httpsUrl(url))return null;
    var codec=String(entry.codec||'').toUpperCase();
    if(codec && ['MP3','AAC','AAC+','MPEG',''].indexOf(codec)===-1)return null;
    if(entry.lastcheckok===0||entry.lastcheckok===false)return null;
    var name=String(entry.name||'').trim();if(!name)return null;
    var uuid=String(entry.stationuuid||'').slice(0,100);
    return safeStation({id:'rb-'+uuid,name:name,region:entry.country||'',subregion:entry.state||'',logo:entry.favicon||'',logoBackup:officialSiteIcon(entry.homepage||''),mark:name.slice(0,3),url:url,home:entry.homepage||'https://www.radio-browser.info/'});
  }
  function editStationLogo(id){
    var s=storedRadioById(id);if(!s)return;
    var answer=prompt('Adresse HTTPS d’une image du logo de '+s.name+' (laisse vide pour rechercher le logo du site officiel) :',s.logo||'');
    if(answer===null)return;
    answer=answer.trim();
    if(answer && !httpsUrl(answer)){alert('Utilise une adresse d’image HTTPS.');return;}
    s.logo=answer;
    s.logoBackup=officialSiteIcon(s.home);
    saveRadios();render();renderRadiosTool();
  }
  function radioBrowserFetch(params,i){
    var hosts=['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info'];
    i=i||0;
    return fetch(hosts[i]+'/json/stations/search?'+params,{headers:{'Accept':'application/json'}})
      .then(function(r){if(!r.ok)throw Error('Annuaire indisponible');return r.json();})
      .catch(function(err){if(i+1<hosts.length)return radioBrowserFetch(params,i+1);throw err;});
  }
  function stationKm(a,b,latitude,longitude){
    var lat=Number(a),lon=Number(b);
    if(!isFinite(lat)||!isFinite(lon))return Infinity;
    var rad=Math.PI/180,phi1=latitude*rad,phi2=lat*rad;
    var deltaPhi=(lat-latitude)*rad,deltaLambda=(lon-longitude)*rad;
    var h=Math.sin(deltaPhi/2)*Math.sin(deltaPhi/2)+Math.cos(phi1)*Math.cos(phi2)*Math.sin(deltaLambda/2)*Math.sin(deltaLambda/2);
    return 12742*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  }
  function renderRadiosTool(){
    var box=el('toolsBody');box.textContent='';
    box.appendChild(make('p','manager-lead','Cinq grandes touches maximum. La sixième ouvre les autres stations. Les favoris et leur ordre sont enregistrés sur cet iPad.'));
    sectionTitle(box,'Mes cinq favorites');
    var list=make('div','manager-list');box.appendChild(list);
    if(!fav.length)list.appendChild(make('div','manager-empty','Aucune favorite : ajoute une station depuis la liste ou la recherche.'));
    fav.forEach(function(s,i){
      var row=managerRow((i+1)+'. '+s.name,s.region||'Radio favorite');
      var preview=logo(s);preview.className='logo-wrap manager-logo';row.row.insertBefore(preview,row.row.firstChild);
      var up=actionButton('↑',function(){moveFavorite(s.id,-1);});up.disabled=i===0;row.actions.appendChild(up);
      var down=actionButton('↓',function(){moveFavorite(s.id,1);});down.disabled=i===fav.length-1;row.actions.appendChild(down);
      row.actions.appendChild(actionButton('Logo',function(){editStationLogo(s.id); }));
      row.actions.appendChild(actionButton('Retirer ★',function(){promoteStation(s.id);},'warn'));
      list.appendChild(row.row);
    });
    sectionTitle(box,'Mes autres stations');
    var extras=make('div','manager-list');box.appendChild(extras);
    if(!other.length)extras.appendChild(make('div','manager-empty','Aucune autre station enregistrée.'));
    other.forEach(function(s){
      var item=managerRow(s.name,s.region||'Station enregistrée');
      var preview=logo(s);preview.className='logo-wrap manager-logo';item.row.insertBefore(preview,item.row.firstChild);
      item.actions.appendChild(actionButton('▶ Écouter',function(){closeTools();choose(s.id);start();}));
      item.actions.appendChild(actionButton('★ Favorite',function(){promoteStation(s.id);},'primary'));
      item.actions.appendChild(actionButton('Logo',function(){editStationLogo(s.id);}));
      item.actions.appendChild(actionButton('Supprimer',function(){removeStation(s.id);},'warn'));
      extras.appendChild(item.row);
    });
    sectionTitle(box,'Chercher une station dans le monde');
    var form=make('form','manager-search');
    var input=make('input','manager-input');input.type='search';input.placeholder='Nom (facultatif si pays choisi)';input.autocomplete='off';input.setAttribute('aria-label','Nom de la radio');
    var country=countryPicker('Filtrer les radios par pays');country.value='BE';
    var region=make('input','manager-input');region.type='search';region.placeholder='Région / province : Hainaut…';region.setAttribute('aria-label','Filtrer les radios par région ou province');
    var geo=make('div','manager-geo-row');geo.appendChild(country);geo.appendChild(region);
    var submit=make('button','manager-btn primary','Rechercher');submit.type='submit';
    form.appendChild(input);form.appendChild(submit);box.appendChild(form);box.appendChild(geo);
    var results=make('div','manager-list');box.appendChild(results);
    var state=feedbackLine(box);
    box.appendChild(make('p','manager-note','Tu peux chercher par nom, par pays, par région/province, ou combiner ces critères. Les régions dépendent des informations publiées par les radios.'));
    function showStations(data,near,position){
      results.textContent='';var used={};
      var matches=data.filter(function(entry){
        if(!near)return true;
        // L’annuaire ne géolocalise pas toutes les radios.
        return stationKm(entry.geo_lat,entry.geo_long,position.latitude,position.longitude)<=60;
      }).sort(function(a,b){return near?stationKm(a.geo_lat,a.geo_long,position.latitude,position.longitude)-stationKm(b.geo_lat,b.geo_long,position.latitude,position.longitude):0;})
      .map(radioSearchResult).filter(function(st){if(!st||used[st.url])return false;used[st.url]=true;return true;}).slice(0,22);
      state(matches.length?(near?'Stations répertoriées à moins de 60 km (selon les positions déclarées) :':'Stations recensées :')+' teste les flux avant de les ajouter.':(near?'Aucune radio géolocalisée à proximité dans cet annuaire. Essaie une recherche par province.':'Aucun flux HTTPS MP3/AAC compatible trouvé pour cette recherche.'));
      matches.forEach(function(st){
        var exists=all.some(function(x){return x.url===st.url||x.id===st.id;});
        var item=managerRow(st.name,([st.region,st.subregion].filter(Boolean).join(' · ')||'Radio')+' · Flux à confirmer sur iPad');
        var img=logo(st);img.className='logo-wrap manager-logo';item.row.insertBefore(img,item.row.firstChild);
        item.actions.appendChild(actionButton('▶ Tester',function(){previewRadio(st);state('Essai : '+st.name+' · utilise Power pour arrêter.');}));
        var add=actionButton(exists?'Enregistrée':'+ Enregistrer',function(){
          if(addStation(st)){add.textContent='Enregistrée';add.disabled=true;state(st.name+' ajoutée aux autres stations. Tu peux la promouvoir en favorite.');}
          else state('Cette station est déjà enregistrée ou la limite est atteinte.');
        },exists?'':'primary');add.disabled=exists;item.actions.appendChild(add);
        results.appendChild(item.row);
      });
    }
    var localTools=make('div','manager-local-search');
    var nearby=actionButton('Stations près de moi · 60 km',function(){
      results.textContent='';state('Recherche de la position de cet iPad…');nearby.disabled=true;
      if(!navigator.geolocation){nearby.disabled=false;state('La géolocalisation n’est pas disponible. Utilise le filtre pays/région.');return;}
      navigator.geolocation.getCurrentPosition(function(pos){
        state('Recherche des radios géolocalisées dans l’annuaire…');
        var latitude=pos.coords.latitude,longitude=pos.coords.longitude;
        var params='limit=250&hidebroken=true&order=votes&reverse=true&is_https=true&geo_lat='+latitude+'&geo_long='+longitude+'&geo_distance=60000';
        radioBrowserFetch(params).then(function(data){
          nearby.disabled=false;showStations(data,true,{latitude:latitude,longitude:longitude});
        }).catch(function(){nearby.disabled=false;state('Recherche locale indisponible. Essaie par pays/région.');});
      },function(){nearby.disabled=false;state('Position non autorisée. Choisis un pays et une province ci-dessous.');},{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
    },'primary');
    localTools.appendChild(nearby);box.insertBefore(localTools,form);
    box.appendChild(make('p','manager-note','La recherche locale utilise la position de l’iPad uniquement pour interroger l’annuaire. Les stations non géolocalisées peuvent manquer : utilise aussi le filtre pays/province.'));
    form.addEventListener('submit',function(e){
      e.preventDefault();var q=input.value.trim(),rgn=region.value.trim();
      if(q.length===1){state('Saisis au moins deux caractères du nom, ou laisse ce champ vide.');return;}
      if(!q&&!rgn&&!country.value){state('Choisis au moins un pays, une région ou un nom de radio.');return;}
      results.textContent='';submit.disabled=true;state('Recherche des stations…');
      var params='limit=80&hidebroken=true&order=votes&reverse=true&is_https=true';
      if(q)params+='&name='+encodeURIComponent(q);
      if(country.value)params+='&countrycode='+encodeURIComponent(country.value);
      if(rgn)params+='&state='+encodeURIComponent(rgn);
      radioBrowserFetch(params).then(function(data){submit.disabled=false;showStations(data,false,null);})
        .catch(function(){submit.disabled=false;state('Annuaire temporairement indisponible. Essaie plus tard ou ajoute une adresse HTTPS directement.');});
    });
    sectionTitle(box,'Ajouter une adresse de diffusion connue');
    var manual=make('form','manager-search');
    var stationName=make('input','manager-input');stationName.placeholder='Nom de la station';stationName.required=true;
    var stationURL=make('input','manager-input');stationURL.placeholder='https://…/radio.mp3';stationURL.type='url';stationURL.required=true;
    var stationLogo=make('input','manager-input');stationLogo.placeholder='Logo HTTPS (facultatif)';stationLogo.type='url';stationLogo.setAttribute('aria-label','Adresse HTTPS du logo');
    var addManual=make('button','manager-btn','Ajouter');addManual.type='submit';
    manual.appendChild(stationName);manual.appendChild(stationURL);manual.appendChild(stationLogo);manual.appendChild(addManual);box.appendChild(manual);
    var manualState=feedbackLine(box);
    manual.addEventListener('submit',function(e){
      e.preventDefault();var url=stationURL.value.trim();
      if(!httpsUrl(url)){manualState('Il faut une adresse de flux HTTPS, pas simplement le site de la radio.');return;}
      var logoInput=stationLogo.value.trim();if(logoInput&&!httpsUrl(logoInput)){manualState('Le logo doit être une adresse d’image HTTPS.');return;}
      var s={id:'manual-'+Date.now(),name:stationName.value.trim(),region:'Ajout manuel',url:url,logo:logoInput,home:'https://www.radio-browser.info/'};
      if(addStation(s)){renderRadiosTool();}else manualState('Cette station existe déjà ou l’adresse n’est pas valide.');
    });
    box.appendChild(make('p','manager-note','Annuaire communautaire Radio Browser : une station référencée n’est pas garantie lisible sur Safari. Les réglages restent propres à chaque appareil et navigateur.'));
    addBackupSection(box);
  }

  el('timerButton').addEventListener('click',function(){openTools('timer');});
  el('toolsClose').addEventListener('click',closeTools);
  toolsModal.addEventListener('click',function(e){if(e.target===toolsModal)closeTools();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&toolsModal.classList.contains('open'))closeTools();});
  timerTick=setInterval(function(){if(timerDeadline)updateTimerLabel();},1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)updateTimerLabel();});
  scheduleDim(40000);

})();
</script>
